<!doctype html><meta charset="utf-8"><title>PhotoSoap smoke test</title><div id="result">RUNNING</div><iframe id="app" src="../index.html" style="width:1100px;height:850px"></iframe><script>
const out=document.getElementById('result');
document.getElementById('app').onload=()=>{
 try {
 const w=document.getElementById('app').contentWindow,d=w.document;
 const check=(condition,message)=>{if(!condition)throw Error(message)};
 const waitFor=async predicate=>{const until=Date.now()+5000;while(Date.now()<until){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,40))}throw Error('Timed out waiting for document restore')};
 check(d.getElementById('canvas').width===1000,'canvas width');
 check(d.querySelectorAll('#layers li').length===1,'initial background');
 d.getElementById('add').click();
 check(d.querySelectorAll('#layers li').length===2,'add layer');
 d.getElementById('lock').click();
 check(d.querySelector('#layers li.active').textContent.includes('🔒'),'layer locking');
 d.getElementById('lock').click();
 d.getElementById('rectangle').click();
 check(d.querySelectorAll('#layers li').length===3,'shape creation');
 d.getElementById('undo').click();
 setTimeout(async ()=>{
 try{
 await waitFor(()=>d.querySelectorAll('#layers li').length===2);check(d.querySelectorAll('#layers li').length===2,'undo');
 d.getElementById('redo').click();
 setTimeout(async ()=>{
 try{
 await waitFor(()=>d.querySelectorAll('#layers li').length===3);check(d.querySelectorAll('#layers li').length===3,'redo');
 const png=d.getElementById('canvas').toDataURL('image/png');
 check(png.startsWith('data:image/png;base64,'),'canvas PNG');
 const app=w;const snap=app.capture();check(app.validateDocument({format:'photosoap',version:1,...snap}).version===2,'v1 migration');
 let rejected=false;try{app.validateDocument({...snap,width:9000})}catch(e){rejected=true}check(rejected,'oversize rejected');
 rejected=false;try{app.validateDocument({...snap,layers:[{...snap.layers[0],x:Infinity}]})}catch(e){rejected=true}check(rejected,'invalid layer rejected');
 d.getElementById('selectall').click();check(app.eval('selection.w')===1000,'select all');d.getElementById('deselect').click();check(app.eval('selection')===null,'deselect');
 
check(!!d.getElementById('maskBrushToggle'),'mask brush controls');d.getElementById('maskBrushToggle').click();check(app.eval('maskBrushEditing')===true,'mask editing enabled');check(typeof app.PhotosoapMaskBrush.paint==='function','mask brush module loaded');d.getElementById('maskBrushToggle').click();
 check(!!d.getElementById('selectionIntersect'),'selection intersection control');check(!!d.getElementById('selectionSave'),'save selection control');check(!!d.getElementById('selectionRestore'),'restore selection control');const selectionGeometry=app.PhotosoapSelectionGeometry;const selectionOverlap=selectionGeometry.intersect({x:0,y:0,w:20,h:20},{x:10,y:5,w:20,h:20});check(selectionOverlap.x===10&&selectionOverlap.y===5&&selectionOverlap.w===10&&selectionOverlap.h===15,'selection overlap geometry');d.getElementById('selectall').click();d.getElementById('selectionSave').click();d.getElementById('deselect').click();d.getElementById('selectionRestore').click();check(app.eval('selection.w')===1000,'saved selection restore');d.getElementById('deselect').click();
check(!!d.getElementById('vectorAddCubic'),'vector curve creation control');const cubicMid=app.PhotosoapVectorPaths.cubic({x:0,y:0},{x:0,y:10},{x:10,y:10},{x:10,y:0},.5);check(Math.abs(cubicMid.x-5)<.001&&Math.abs(cubicMid.y-7.5)<.001,'cubic geometry');const layersBeforeVector=d.querySelectorAll('#layers li').length;d.getElementById('vectorAddCubic').click();check(d.querySelectorAll('#layers li').length===layersBeforeVector+1,'vector curve layer added');check(d.querySelector('#layers li.active').textContent.includes('Bézier'),'vector layer selected');
check(app.PhotosoapVectorPaths.distance({x:0,y:0},{x:3,y:4})===5,'vector distance');check(app.PhotosoapVectorPaths.quadratic({x:0,y:0},{x:5,y:10},{x:10,y:0},.5).y===5,'quadratic midpoint');
 check(!!d.getElementById('typographyAdd'),'wrapped text control');check(app.PhotosoapTypographyLayout.lineHeight(20,1.5)===30,'typography leading');const measure=d.createElement('canvas').getContext('2d');measure.font='20px sans-serif';check(app.PhotosoapTypographyLayout.wrap(measure,'alpha beta gamma',75).length>=2,'typography wraps lines');const textLayersBefore=d.querySelectorAll('#layers li').length;d.getElementById('typographyText').value='First line of text and second line';d.getElementById('typographyAdd').click();check(d.querySelectorAll('#layers li').length===textLayersBefore+1,'wrapped text layer created');check(d.querySelector('#layers li.active').textContent.includes('Wrapped Text'),'wrapped text selected');
check(!!d.getElementById('typographyAlign'),'text alignment selector');check(!!d.getElementById('typographyColor'),'text color selector');d.getElementById('typographyAlign').value='center';d.getElementById('typographyColor').value='#ff0000';const alignmentBefore=d.querySelectorAll('#layers li').length;d.getElementById('typographyAdd').click();check(d.querySelectorAll('#layers li').length===alignmentBefore+1,'centered colored text layer created');
 check(!!d.getElementById('typographyFamily'),'font family selector');check(!!d.getElementById('typographyBold'),'bold control');check(!!d.getElementById('typographyItalic'),'italic control');d.getElementById('typographyFamily').value='serif';d.getElementById('typographyBold').checked=true;d.getElementById('typographyItalic').checked=true;const styledBefore=d.querySelectorAll('#layers li').length;d.getElementById('typographyAdd').click();check(d.querySelectorAll('#layers li').length===styledBefore+1,'styled typography layer created');
 check(!!d.getElementById('typographyUnderline'),'underline control');check(!!d.getElementById('typographyStrike'),'strikethrough control');d.getElementById('typographyUnderline').checked=true;d.getElementById('typographyStrike').checked=true;const decoratedBefore=d.querySelectorAll('#layers li').length;d.getElementById('typographyAdd').click();check(d.querySelectorAll('#layers li').length===decoratedBefore+1,'decorated text layer created');
 check(!!d.getElementById('typographyShadow'),'text shadow control');check(!!d.getElementById('typographyShadowBlur'),'text shadow blur control');check(!!d.getElementById('typographyShadowColor'),'text shadow color control');d.getElementById('typographyShadow').checked=true;d.getElementById('typographyShadowBlur').value='8';const shadowBefore=d.querySelectorAll('#layers li').length;d.getElementById('typographyAdd').click();check(d.querySelectorAll('#layers li').length===shadowBefore+1,'shadow text layer created');
 out.textContent='PASS: editor smoke tests';
 }catch(e){out.textContent='FAIL: '+e.message}
 },350);
 }catch(e){out.textContent='FAIL: '+e.message}
 },350);
 }catch(e){out.textContent='FAIL: '+e.message}
};
</script>
