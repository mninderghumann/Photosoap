w</button><button id="crop">Crop selection</button><button id="selectall">Select all</button><button data-tool="select">Select area</button><button id="deselect">Deselect</button><button id="resize">Resize canvas</button><label for="preset">Design size</label><select id="preset" aria-label="Design canvas size"><option value="1080x1080">Square post · 1080×1080</option><option value="1080x1920">Story · 1080×1920</option><option value="1920x1080">Presentation · 1920×1080</option><option value="1200x628">Social banner · 1200×628</option><option value="794x1123">A4 preview · 794×1123</option></select><button id="applypreset">Apply design size</button><label for="designtemplate">Starter template</label><select id="designtemplate"><option value="announcement">Announcement card</option><option value="quote">Quote post</option><option value="sale">Sale banner</option><option value="event">Event invitation</option><option value="launch">Product launch</option><option value="thankyou">Thank-you card</option><option value="workshop">Workshop flyer</option><option value="birthday">Birthday greeting</option></select><button id="applytemplate">Add template elements</button><label for="brandprimary">Brand primary color</label><input id="brandprimary" type="color" value="#2563eb"><label for="brandsecondary">Brand secondary color</label><input id="brandsecondary" type="color" value="#333333"><label for="brandfont">Brand font</label><select id="brandfont"><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Verdana">Verdana</option><option value="Trebuchet MS">Trebuchet MS</option><option value="Courier New">Courier New</option></select><button id="savebrand">Save brand kit</button><button id="applybrand">Apply brand kit</button><label for="alignlayer">Align selected layer</label><select id="alignlayer" aria-label="Layer alignment"><option value="center">Center on canvas</option><option value="left">Align left</option><option value="right">Align r <script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let layers=[],selected=null,tool='move',drag=false,last=null,history=[],future=[],counter=0;let autosaveHandle=null;let selection=null;let selectionOrigin=null;let panMode=false,panStart=null;let autosaveWarning='';const MAX_PIXELS=16000000,MAX_LAYERS=50;
function layer(name){const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;return {id:++counter,name,canvas:c,x:0,y:0,opacity:1,brightness:100,contrast:100,visible:true,locked:false}}
function capture(){return {format:'photosoap',version:2,width:canvas.width,height:canvas.height,selected,layers:layers.map(l=>({id:l.id,name:l.name,x:l.x,y:l.y,opacity:l.opacity,brightness:l.brightness,contrast:l.contrast,visible:l.visible,locked:!!l.locked,textData:l.textData||undefined,shapeData:l.shapeData||undefined,elementData:l.elementData||undefined,data:l.canvas.toDataURL()}))}}
function validateDocument(s){if(!s||typeof s!=='object'||Array.isArray(s)||s.format&&s.format!=='photosoap'||![1,2].includes(s.version??1)||!Number.isInteger(s.width)||!Number.isInteger(s.height)||s.width<1||s.height<1||s.width>6000||s.height>6000||s.width*s.height>MAX_PIXELS||!Array.isArray(s.layers)||s.layers.length>MAX_LAYERS||s.width*s.height*s.layers.length>48000000)throw Error('Invalid document');const ids=new Set();for(const l of s.layers){if(!l||typeof l!=='object'||Array.isArray(l))throw Error('Invalid layer');if(!Number.isSafeInteger(l.id)||l.id<1||ids.has(l.id)||typeof l.name!=='string'||l.name.length>200||typeof l.data!=='string'||!/^data:image\/png;base64,[A-Za-z0-9+/]+=*$/.test(l.data)||l.data.length>50000000||![l.x,l.y,l.opacity,l.brightness,l.contrast].every(Number.isFinite)||Math.abs(l.x)>12000||Math.abs(l.y)>12000||l.opacity<0||l.opacity>1||l.brightness<0||l.brightness>200||l.contrast<0||l.contrast>200||('visible' in l&&typeof l.visible!=='boolean')||('locked' in l&&typeof l.locked!=='boolean'))throw Error('Invalid layer');if(l.textData!==undefined){const t=l.textData;if(!t||typeof t!=='object'||typeof t.value!=='string'||t.value.length>10000||!Number.isFinite(t.size)||t.size<8||t.size>300||!['Arial','Georgia','Verdana','Trebuchet MS','Courier New'].includes(t.font)||!['400','700'].includes(t.weight)||!['left','center','right'].includes(t.align)||!/^#[0-9a-fA-F]{6}$/.test(t.color)||(t.leading!==undefined&&(!Number.isFinite(t.leading)||t.leading<.8||t.leading>3))||(t.tracking!==undefined&&(!Number.isFinite(t.tracking)||t.tracking< -5||t.tracking>30)))throw Error('Invalid text layer')}if(l.shapeData!==undefined){const d=l.shapeData;if(!d||!['rectangle','ellipse','line'].includes(d.kind)||![d.x,d.y,d.w,d.h,d.stroke].every(Number.isFinite)||d.w<=0||d.h<=0||d.stroke<1||d.stroke>100||![d.x,d.y,d.w,d.h].every(n=>Math.abs(n)<=12000)||!/^#[0-9a-fA-F]{6}$/.test(d.color))throw Error('Invalid shape layer')}if(l.elementData!==undefined){const d=l.elementData;if(!d||!['star','heart','triangle','arrow','diamond','hexagon','plus','chevron'].includes(d.kind)||![d.x,d.y,d.w,d.h].every(Number.isFinite)||d.w<=0||d.h<=0||![d.x,d.y,d.w,d.h].every(n=>Math.abs(n)<=12000)||!/^#[0-9a-fA-F]{6}$/.test(d.color))throw Error('Invalid element layer')}ids.add(l.id)}if(s.selected!=null&&(!Number.isSafeInteger(s.selected)||!ids.has(s.selected)))throw Error('Invalid selected layer');return {format:'photosoap',version:2,width:s.width,height:s.height,selected:s.selected??null,layers:s.layers.map(l=>({id:l.id,name:l.name,data:l.data,x:l.x,y:l.y,opacity:l.opacity,brightness:l.brightness,contrast:l.contrast,visible:l.visible!==false,locked:!!l.locked}))}}
async function restore(s){s=validateDocument(s);const rebuilt=await Promise.all(s.layers.map(async l=>{const im=new Image();await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=l.data});if(im.naturalWidth!==s.width||im.naturalHeight!==s.height)throw Error('Layer image dimensions do not match document');const c=document.createElement('canvas');c.width=s.width;c.height=s.height;c.getContext('2d').drawImage(im,0,0);return {...l,canvas:c}}));canvas.width=s.width;canvas.height=s.height;selected=rebuilt.some(l=>l.id===s.selected)?s.selected:(rebuilt.at(-1)?.id??null);layers=rebuilt;selection=null;counter=Math.max(counter,0,...layers.map(l=>Number(l.id)||0));refresh()}
// Phase 2 page preview: independent page snapshots, without changing the v2 project format.
let pageRecords=[],pageIndex=0,pageSequence=1,pageSwitching=false;
function rememberPage(){if(pageRecords.length)pageRecords[pageIndex].snapshot=capture()}
function updatePagePicker(){const picker=$('pagepicker');picker.innerHTML='';pageRecords.forEach((p,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=p.name;picker.append(option)});picker.value=String(pageIndex)}
async function switchPage(index){if(pageSwitching||index===pageIndex||!pageRecords[index])return;pageSwitching=true;const previous=pageIndex;rememberPage();try{await restore(pageRecords[index].snapshot);pageIndex=index;history=[];future=[];updateButtons();updatePagePicker()}catch(err){pageIndex=previous;updatePagePicker();alert('Cannot open page: '+err.message)}finally{pageSwitching=false}}
$('pagepicker').onchange=e=>switchPage(Number(e.target.value));
$('pageexport').onclick=async()=>{if(pageSwitching)return;rememberPage();const previous=pageIndex;pageSwitching=true;try{for(let i=0;i<pageRecords.length;i++){const snapshot=validateDocument(pageRecords[i].snapshot);await restore(snapshot);render(false);const filename='photosoap-page-'+String(i+1).padStart(2,'0')+'.png';download(canvas.toDataURL('image/png'),filename)}await restore(pageRecords[previous].snapshot);pageIndex=previous;updatePagePicker()}catch(err){try{await restore(pageRecords[previous].snapshot)}catch{}pageIndex=previous;updatePagePicker();alert('Page export failed: '+err.message)}finally{pageSwitching=false;render()}};
function zipCRC(bytes){let crc=0xffffffff;for(const b of bytes){crc^=b;for(let k=0;k<8;k++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}return (crc^0xffffffff)>>>0}
function makeZip(entries){const enc=new TextEncoder(),parts=[],central=[];let offset=0;for(const entry of entries){const name=enc.encode(entry.name),data=entry.bytes,crc=zipCRC(data);const local=new Uint8Array(30+name.length),v=new DataView(local.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);local.set(name,30);parts.push(local,data);const cd=new Uint8Array(46+name.length),c=new DataView(cd.buffer);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,offset,true);cd.set(name,46);central.push(cd);offset+=local.length+data.length}const centralSize=central.reduce((n,b)=>n+b.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,entries.length,true);v.setUint16(10,entries.length,true);v.setUint32(12,centralSize,true);v.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/zip'})}
$('pagezip').onclick=async()=>{if(pageSwitching)return;rememberPage();const previous=pageIndex;pageSwitching=true;try{const entries=[];for(let i=0;i<pageRecords.length;i++){await restore(validateDocument(pageRecords[i].snapshot));render(false);const response=await fetch(canvas.toDataURL('image/png'));entries.push({name:'photosoap-page-'+String(i+1).padStart(2,'0')+'.png',bytes:new Uint8Array(await response.arrayBuffer())})}const url=URL.createObjectURL(makeZip(entries));download(url,'photosoap-pages.zip');setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(err){alert('ZIP export failed: '+err.message)}finally{await restore(pageRecords[previous].snapshot);pageIndex=previous;updatePagePicker();pageSwitching=false;render()}};
function pdfBytes(images){const enc=new TextEncoder(),parts=[],offsets=[0];let length=0;const add=b=>{parts.push(b);length+=b.length},ascii=t=>add(enc.encode(t));ascii('%PDF-1.4\n');const count=images.length,root=1,pages=2;const obj=(n,body)=>{offsets[n]=length;ascii(n+' 0 obj\n'+body+'\nendobj\n')};obj(root,'<< /Type /Catalog /Pages 2 0 R >>');obj(pages,'<< /Type /Pages /Count '+count+' /Kids ['+images.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>');images.forEach((im,i)=>{const n=3+i*3,w=im.width,h=im.height,stream=enc.encode('q '+w+' 0 0 '+h+' 0 0 cm /Im0 Do Q\n');obj(n,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+w+' '+h+'] /Resources << /XObject << /Im0 '+(n+2)+' 0 R >> >> /Contents '+(n+1)+' 0 R >>');offsets[n+1]=length;ascii((n+1)+' 0 obj\n<< /Length '+stream.length+' >>\nstream\n');add(stream);ascii('endstream\nendobj\n');offsets[n+2]=length;ascii((n+2)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+' >>\nstream\n');add(im.bytes);ascii('\nendstream\nendobj\n')});const start=length;ascii('xref\n0 '+offsets.length+'\n0000000000 65535 f \n');for(let i=1;i<offsets.length;i++)ascii(String(offsets[i]).padStart(10,'0')+' 00000 n \n');ascii('trailer\n<< /Size '+offsets.length+' /Root 1 0 R >>\nstartxref\n'+start+'\n%%EOF');return new Blob(parts,{type:'application/pdf'})}
$('pagepdf').onclick=async()=>{if(pageSwitching)return;rememberPage();const previous=pageIndex;pageSwitching=true;try{const images=[];for(const record of pageRecords){await restore(validateDocument(record.snapshot));render(false);const response=await fetch(canvas.toDataURL('image/jpeg',0.92));images.push({width:canvas.width,height:canvas.height,bytes:new Uint8Array(await response.arrayBuffer())})}const url=URL.createObjectURL(pdfBytes(images));download(url,'photosoap-pages.pdf');setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(err){alert('PDF export failed: '+err.message)}finally{await restore(pageRecords[previous].snapshot);pageIndex=previous;updatePagePicker();pageSwitching=false;render()}};
function svgPage(data,width,height){if(!Number.isSafeInteger(width)||!Number.isSafeInteger(height)||width<1||height<1||!/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(data))throw Error('Invalid SVG image');return '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'"><image width="'+width+'" height="'+height+'" href="'+data+'"/></svg>'}
$('pagesvg').onclick=async()=>{if(pageSwitching)return;rememberPage();const previous=pageIndex;pageSwitching=true;try{const entries=[];for(let i=0;i<pageRecords.length;i++){await restore(validateDocument(pageRecords[i].snapshot));render(false);const escapeXML=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');const elements=layers.filter(l=>l.visible).map(l=>{const d=l.shapeData;if(!d||l.brightness!==100||l.contrast!==100)return '<image x="'+l.x+'" y="'+l.y+'" width="'+canvas.width+'" height="'+canvas.height+'" opacity="'+l.opacity+'" href="'+l.canvas.toDataURL('image/png')+'"/>';const common=' opacity="'+l.opacity+'" fill="'+escapeXML(d.color)+'"';if(d.kind==='rectangle')return '<rect x="'+(l.x+d.x)+'" y="'+(l.y+d.y)+'" width="'+d.w+'" height="'+d.h+'"'+common+'/>';if(d.kind==='ellipse')return '<ellipse cx="'+(l.x+d.x+d.w/2)+'" cy="'+(l.y+d.y+d.h/2)+'" rx="'+(d.w/2)+'" ry="'+(d.h/2)+'"'+common+'/>';return '<line x1="'+(l.x+d.x)+'" y1="'+(l.y+d.y)+'" x2="'+(l.x+d.x+d.w)+'" y2="'+(l.y+d.y+d.h)+'" stroke="'+escapeXML(d.color)+'" stroke-width="'+d.stroke+'" stroke-linecap="round" opacity="'+l.opacity+'"/>'}).join('');const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+canvas.width+'" height="'+canvas.height+'" viewBox="0 0 '+canvas.width+' '+canvas.height+'">'+elements+'</svg>';entries.push({name:'photosoap-page-'+String(i+1).padStart(2,'0')+'.svg',bytes:new TextEncoder().encode(svg)})}const blob=entries.length===1?new Blob([entries[0].bytes],{type:'image/svg+xml'}):makeZip(entries);const url=URL.createObjectURL(blob);download(url,entries.length===1?entries[0].name:'photosoap-svg-pages.zip');setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(err){alert('SVG export failed: '+err.message)}finally{await restore(pageRecords[previous].snapshot);pageIndex=previous;updatePagePicker();pageSwitching=false;render()}};
$('pagerename').onclick=()=>{if(pageSwitching)return;const name=prompt('Page name',pageRecords[pageIndex]?.name||'');if(name===null)return;const clean=name.trim().slice(0,80);if(!clean)return;pageRecords[pageIndex].name=clean;updatePagePicker()};
function shiftPage(delta){if(pageSwitching)return;const next=pageIndex+delta;if(next<0||next>=pageRecords.length)return;rememberPage();[pageRecords[pageIndex],pageRecords[next]]=[pageRecords[next],pageRecords[pageIndex]];pageIndex=next;updatePagePicker()}
$('pageup').onclick=()=>shiftPage(-1);
$('pagedown').onclick=()=>shiftPage(1);

$('applytemplate').onclick=()=>{const kind=$('designtemplate').value;const specs={announcement:{heading:'BIG NEWS',subtitle:'Add your announcement here',accent:'#2563eb'},quote:{heading:'YOUR QUOTE',subtitle:'— Your name',accent:'#7c3aed'},sale:{heading:'SPECIAL OFFER',subtitle:'Limited time only',accent:'#dc2626'},event:{heading:'YOU ARE INVITED',subtitle:'Date · Time · Location',accent:'#0f766e'},launch:{heading:'INTRODUCING',subtitle:'Your next big thing',accent:'#4338ca'},thankyou:{heading:'THANK YOU',subtitle:'We appreciate your support',accent:'#be185d'},workshop:{heading:'JOIN THE WORKSHOP',subtitle:'Learn · Create · Connect',accent:'#b45309'},birthday:{heading:'HAPPY BIRTHDAY',subtitle:'Wishing you a wonderful day',accent:'#9333ea'}};const spec=specs[kind];if(!spec)return;if(layers.length+3>MAX_LAYERS||(layers.length+3)*canvas.width*canvas.height>48000000){alert('Not enough layer capacity for template');return}const w=canvas.width,h=canvas.height;const shape=addLayer('Template accent');shape.shapeData={kind:'rectangle',x:Math.round(w*.08),y:Math.round(h*.18),w:Math.round(w*.84),h:Math.max(12,Math.round(h*.04)),color:spec.accent,stroke:12};drawShapeLayer(shape);const addTemplateText=(value,size,y)=>{const l=addLayer('Template: '+value);l.textData={value,size,font:'Arial',weight:'700',align:'center',color:spec.accent};drawTextLayer(l);l.y=y;return l};addTemplateText(spec.heading,Math.max(24,Math.min(100,Math.round(w*.075))),Math.round(h*.28));const subtitle=addTemplateText(spec.subtitle,Math.max(16,Math.min(52,Math.round(w*.035))),Math.round(h*.49));subtitle.textData.weight='400';subtitle.textData.color='#333333';drawTextLayer(subtitle);refresh()};
$('rectangle').onclick=()=>{const l=addLayer('Rectangle');if(!l)return;l.shapeData={kind:'rectangle',x:80,y:80,w:280,h:180,color:$('color').value,stroke:12};drawShapeLayer(l);refresh()};
$('ellipse').onclick=()=>{const l=addLayer('Ellipse');if(!l)return;l.shapeData={kind:'ellipse',x:80,y:80,w:320,h:200,color:$('color').value,stroke:12};drawShapeLayer(l);refresh()};
$('line').onclick=()=>{const l=addLayer('Line');if(!l)return;l.shapeData={kind:'line',x:70,y:90,w:400,h:250,color:$('color').value,stroke:Math.max(1,Number($('size').value)||12)};drawShapeLayer(l);refresh()};
$('background').onclick=()=>{const l=layers[0];if(!l||l.locked)return;checkpoint();const c=l.canvas.getContext('2d');c.save();c.globalCompositeOperation='destination-over';c.fillStyle=$('bgcolor').value;c.fillRect(0,0,canvas.width,canvas.height);c.restore();refresh()};
$('rotate').onclick=()=>{const l=active();if(!l||l.locked)return;checkpoint();const tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=canvas.height;const t=tmp.getContext('2d');t.translate(canvas.width/2,canvas.height/2);t.rotate(Math.PI/2);t.drawImage(l.canvas,-canvas.width/2,-canvas.height/2);l.canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);l.canvas.getContext('2d').drawImage(tmp,0,0);refresh()};
$('flip').onclick=()=>{const l=active();if(!l||l.locked)return;checkpoint();const tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=canvas.height;const t=tmp.getContext('2d');t.translate(tmp.width,0);t.scale(-1,1);t.drawImage(l.canvas,0,0);l.canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);l.canvas.getContext('2d').drawImage(tmp,0,0);refresh()};
$('save').onclick=()=>{render(false);const a=document.createElement('a');a.download='photosoap-design.png';a.href=canvas.toDataURL('image/png');a.click();render()};
function download(data,name){const a=document.createElement('a');a.download=name;a.href=data;a.click()}
$('jpg').onclick=()=>{render(false);const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(canvas,0,0);download(c.toDataURL('image/jpeg',.92),'photosoap-design.jpg');render()};
$('project').onclick=()=>{rememberPage();const data=JSON.stringify({format:'photosoap',version:3,activePage:pageIndex,pages:pageRecords.map(p=>({name:p.name,document:p.snapshot}))});const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));download(url,'photosoap-project.json');setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('loadproject').onclick=()=>$('projectfile').click();
$('projectfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());let incoming;if(data.format==='photosoap'&&data.version===3){if(!Array.isArray(data.pages)||data.pages.length<1||data.pages.length>20||!Number.isInteger(data.activePage)||data.activePage<0||data.activePage>=data.pages.length)throw Error('Invalid pages');incoming=data.pages.map(p=>{if(!p||typeof p.name!=='string'||!p.name.trim()||p.name.length>80)throw Error('Invalid page name');return {name:p.name,snapshot:validateDocument(p.document)}})}else{incoming=[{name:'Page 1',snapshot:validateDocument(data)}]}const target=data.version===3?data.activePage:0;await restore(incoming[target].snapshot);pageRecords=incoming;pageIndex=target;pageSequence=incoming.length;history=[];future=[];updateButtons();updatePagePicker()}catch(err){alert('Could not open project: '+err.message)}e.target.value=''};
$('lock').onclick=()=>{const l=active();if(!l)return;checkpoint();l.locked=!l.locked;refresh()};
$('duplicate').onclick=()=>{const l=active();if(!l)return;const n=addLayer(l.name+' copy');if(!n)return;n.canvas.getContext('2d').drawImage(l.canvas,0,0);n.x=l.x;n.y=l.y;n.opacity=l.opacity;n.brightness=l.brightness;n.contrast=l.contrast;refresh()};
$('offsetduplicate').onclick=()=>{const l=active(),offset=Number($('duplicateoffset').value);if(!l||!Number.isInteger(offset)||Math.abs(offset)>1000){alert('Select a layer and enter an offset between -1000 and 1000');return}if(Math.abs(l.x+offset)>12000||Math.abs(l.y+offset)>12000){alert('Duplicate position exceeds the document limit');return}const n=addLayer(l.name+' copy');if(!n)return;n.canvas.getContext('2d').drawImage(l.canvas,0,0);n.x=l.x+offset;n.y=l.y+offset;n.opacity=l.opacity;n.brightness=l.brightness;n.contrast=l.contrast;n.visible=l.visible;n.locked=false;refresh()};
$('clear').onclick=()=>{const l=active();if(!l||l.locked)return;checkpoint();l.canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);refresh()};
function resizeDesign(w,h){if(!Number.isInteger(w)||!Number.isInteger(h)||w<1||h<1||w>6000||h>6000||w*h>MAX_PIXELS||w*h*layers.length>48000000){alert('Design dimensions exceed the canvas or layer memory limit');return false}if(w===canvas.width&&h===canvas.height)return true;checkpoint();const oldW=canvas.width,oldH=canvas.height;layers.forEach(l=>{const old=l.canvas,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(old,0,0,w,h);l.canvas=c;l.x=l.x*w/oldW;l.y=l.y*h/oldH});canvas.width=w;canvas.height=h;selection=null;refresh();return true}
$('resize').onclick=()=>{const w=Number(prompt('New width in pixels (1–6000)',canvas.width)),h=Number(prompt('New height in pixels (1–6000)',canvas.height));if(!Number.isFinite(w)||!Number.isFinite(h))return;resizeDesign(w,h)};
$('applypreset').onclick=()=>{const [w,h]=$('preset').value.split('x').map(Number);resizeDesign(w,h)};
$('showgrid').onchange=()=>render();$('gridsize').onchange=()=>render();
$('applyposition').onclick=()=>{const l=active();if(!l||l.locked){alert('Select an unlocked layer to position');return}const x=Number($('layerx').value),y=Number($('layery').value);if(!Number.isInteger(x)||!Number.isInteger(y)||Math.abs(x)>12000||Math.abs(y)>12000){alert('Position must be an integer between -12000 and 12000');return}const spacing=Math.max(5,Math.min(500,Number($('gridsize').value)||50));const nx=$('snapgrid').checked?Math.round(x/spacing)*spacing:x,ny=$('snapgrid').checked?Math.round(y/spacing)*spacing:y;if(l.x===nx&&l.y===ny)return;checkpoint();l.x=nx;l.y=ny;refresh()};
$('applyalign').onclick=()=>{const l=active();if(!l||l.locked){alert('Select an unlocked layer to align');return}const mode=$('alignlayer').value;const w=l.canvas.width,h=l.canvas.height;let x=l.x,y=l.y;switch(mode){case 'center':x=(canvas.width-w)/2;y=(canvas.height-h)/2;break;case 'left':x=0;break;case 'right':x=canvas.width-w;break;case 'top':y=0;break;case 'bottom':y=canvas.height-h;break;case 'hcenter':x=(canvas.width-w)/2;break;case 'vcenter':y=(canvas.height-h)/2;break;default:return}if(x===l.x&&y===l.y)return;checkpoint();l.x=x;l.y=y;refresh()};
$('deselect').onclick=()=>{selection=null;render()};$('selectall').onclick=()=>{selection={x:0,y:0,w:canvas.width,h:canvas.height};render()};
$('crop').onclick=()=>{if(!selection||selection.w<1||selection.h<1){alert('Choose Select area and drag a rectangle on the canvas first');return}const ox=Math.max(0,Math.floor(selection.x)),oy=Math.max(0,Math.floor(selection.y)),w=Math.min(canvas.width-ox,Math.ceil(selection.x+selection.w)-ox),h=Math.min(canvas.height-oy,Math.ceil(selection.y+selection.h)-oy);if(w<1||h<1||!confirm('Crop canvas to the selected area?'))return;checkpoint();layers.forEach(l=>{const old=l.canvas;const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(old,l.x-ox,l.y-oy);l.canvas=c;l.x=0;l.y=0});canvas.width=w;canvas.height=h;selection=null;refresh()};
window.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement||e.target instanceof HTMLTextAreaElement||e.target.isContentEditable)return;if(e.key==='Escape'){selection=null;render();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)$('redo').click();else $('undo').click()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('project').click()}});
const base=layer('Background');base.canvas.getContext('2d').fillStyle='#ffffff';base.canvas.getContext('2d').fillRect(0,0,canvas.width,canvas.height);layers.push(base);selected=base.id;refresh();clearTimeout(autosaveHandle);recoverAutosave();

pageRecords=[{name:'Page 1',snapshot:capture()}];updatePagePicker();
</script></body></html>
