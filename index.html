<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhotoSoap Studio</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e9edf5;background:#11141b}*{box-sizing:border-box}body{margin:0}header{height:58px;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#1d2330;border-bottom:1px solid #353e4c}button,input{font:inherit}button{background:#303b4d;color:#fff;border:1px solid #485467;border-radius:7px;padding:8px 11px;cursor:pointer}button:hover{background:#42516a}button:disabled{opacity:.4;cursor:default}button.primary{background:#6861e8;border-color:#8883ff}header strong{margin-right:auto;font-size:19px}main{display:grid;grid-template-columns:210px minmax(0,1fr)260px;height:calc(100vh - 58px)}aside{background:#1d2330;padding:16px;overflow:auto}aside:first-child{border-right:1px solid #353e4c}aside:last-child{border-left:1px solid #353e4c}h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#b5bfd1}label{display:block;font-size:12px;color:#b5bfd1;margin:12px 0 5px}input[type=range]{width:100%}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stage{background-color:#252b35;background-image:linear-gradient(45deg,#303744 25%,transparent 25%),linear-gradient(-45deg,#303744 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#303744 75%),linear-gradient(-45deg,transparent 75%,#303744 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:24px}canvas{max-width:100%;max-height:100%;box-shadow:0 8px 30px #0008;cursor:crosshair}#layers{list-style:none;padding:0}#layers li{padding:10px;border:1px solid #404a5b;border-radius:7px;margin:7px 0;cursor:pointer;display:flex;justify-content:space-between;gap:6px}#layers li.active{border-color:#958fff;background:#343456}.muted{font-size:12px;color:#aab6c9;line-height:1.6}.row{display:flex;gap:6px;flex-wrap:wrap}#status{font-size:11px;color:#aab6c9;margin-top:15px}@media(max-width:760px){main{grid-template-columns:1fr;height:auto}aside{border:0!important}.stage{min-height:55vh;order:-1}header{height:auto;flex-wrap:wrap}header strong{width:100%}}
</style></head><body>
<header><strong>◈ PhotoSoap <span style="font-weight:400;color:#b9c2d4">Studio</span></strong><button id="open">Open image</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="project">Save project</button><button id="loadproject">Open project</button><button id="jpg">Export JPG</button><button id="save" class="primary">Export PNG</button><input id="projectfile" type="file" accept=".json,application/json" hidden><input id="file" type="file" accept="image/*" hidden></header>
<main><aside><h3>Tools</h3><div class="tools"><button data-tool="move">Move</button><button data-tool="brush">Brush</button><button data-tool="erase">Erase</button><button id="text">Add text</button><button id="rectangle">Rectangle</button><button id="rotate">Rotate 90°</button><button id="flip">Flip H</button><button id="fit">Reset view</button><button id="crop">Crop center</button><button id="resize">Resize canvas</button><button id="duplicate">Duplicate</button><button id="clear">Clear layer</button></div><label>Brush size <span id="sizeval">12</span> px</label><input id="size" type="range" min="1" max="100" value="12"><label>Brush color</label><input id="color" type="color" value="#e85082"><label>Zoom</label><input id="zoom" type="range" min="20" max="200" value="100"><p class="muted">Choose a layer, then use Move to drag it. Brush and Erase paint on the selected layer. Changes can be undone.</p></aside>
<section class="stage"><canvas id="canvas" width="1000" height="700" aria-label="Photo editing canvas"></canvas></section>
<aside><h3>Layers</h3><div class="row"><button id="add">+ Layer</button><button id="delete">Delete</button><button id="up">↑</button><button id="down">↓</button></div><ul id="layers"></ul><h3>Adjust selected layer</h3><label>Opacity <span id="opacityval">100%</span></label><input id="opacity" type="range" min="0" max="100" value="100"><label>Brightness <span id="brightnessval">100%</span></label><input id="brightness" type="range" min="0" max="200" value="100"><label>Contrast <span id="contrastval">100%</span></label><input id="contrast" type="range" min="0" max="200" value="100"><p id="status" role="status"></p></aside></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let layers=[],selected=null,tool='move',drag=false,last=null,history=[],future=[],counter=0;let autosaveHandle=null;
function layer(name){const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;return {id:++counter,name,canvas:c,x:0,y:0,opacity:1,brightness:100,contrast:100,visible:true}}
function capture(){return {width:canvas.width,height:canvas.height,selected,layers:layers.map(l=>({id:l.id,name:l.name,x:l.x,y:l.y,opacity:l.opacity,brightness:l.brightness,contrast:l.contrast,visible:l.visible,data:l.canvas.toDataURL()}))}}
async function restore(s){canvas.width=s.width;canvas.height=s.height;selected=s.selected;layers=await Promise.all(s.layers.map(async l=>{const c=document.createElement('canvas');c.width=s.width;c.height=s.height;const im=new Image();await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=l.data});c.getContext('2d').drawImage(im,0,0);return {...l,canvas:c}}));counter=Math.max(counter,0,...layers.map(l=>Number(l.id)||0));refresh()}
function checkpoint(){scheduleAutosave();history.push(capture());if(history.length>30)history.shift();future=[];updateButtons()}
function updateButtons(){$('undo').disabled=!history.length;$('redo').disabled=!future.length}
function active(){return layers.find(l=>l.id===selected)}
function scheduleAutosave(){clearTimeout(autosaveHandle);autosaveHandle=setTimeout(()=>{try{const snapshot={format:'photosoap',version:1,...capture()};const encoded=JSON.stringify(snapshot);if(encoded.length<3500000)localStorage.setItem('photosoap-autosave-v1',encoded)}catch(e){console.warn('Autosave unavailable',e)}},1200)}
async function recoverAutosave(){try{const raw=localStorage.getItem('photosoap-autosave-v1');if(!raw)return;const saved=JSON.parse(raw);if(saved.format==='photosoap'&&saved.version===1&&saved.width>0&&saved.height>0&&Array.isArray(saved.layers)&&confirm('Restore your previous PhotoSoap session?'))await restore(saved)}catch(e){console.warn('Recovery unavailable',e)}}
function render(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const l of layers){if(!l.visible)continue;ctx.save();ctx.globalAlpha=l.opacity;ctx.filter='brightness('+l.brightness+'%) contrast('+l.contrast+'%)';ctx.drawImage(l.canvas,l.x,l.y);ctx.restore()}}
function refresh(){scheduleAutosave();render();$('layers').innerHTML='';[...layers].reverse().forEach(l=>{const li=document.createElement('li');li.className=l.id===selected?'active':'';const name=document.createElement('span');name.textContent=l.name;li.append(name);const toggle=document.createElement('button');toggle.textContent=l.visible?'◉':'○';toggle.title='Toggle visibility';toggle.onclick=e=>{e.stopPropagation();checkpoint();l.visible=!l.visible;refresh()};li.append(toggle);li.onclick=()=>{selected=l.id;refresh()};$('layers').append(li)});const l=active();if(l){$('opacity').value=Math.round(l.opacity*100);$('brightness').value=l.brightness;$('contrast').value=l.contrast;$('opacityval').textContent=Math.round(l.opacity*100)+'%';$('brightnessval').textContent=l.brightness+'%';$('contrastval').textContent=l.contrast+'%'}$('status').textContent=canvas.width+' × '+canvas.height+' · '+layers.length+' layers';updateButtons()}
function addLayer(name){checkpoint();const l=layer(name||'Layer '+(counter+1));layers.push(l);selected=l.id;refresh();return l}
$('open').onclick=()=>$('file').click();$('file').onchange=e=>{const file=e.target.files[0];if(!file)return;if(file.size>25000000){alert('Image exceeds the 25 MB import limit');return}if(!file.type.startsWith('image/')){alert('Please choose an image');return}const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{checkpoint();const l=layer(file.name);const scale=Math.min(canvas.width/im.width,canvas.height/im.height);const w=im.width*scale,h=im.height*scale;l.canvas.getContext('2d').drawImage(im,(canvas.width-w)/2,(canvas.height-h)/2,w,h);layers.push(l);selected=l.id;refresh();URL.revokeObjectURL(url);$('file').value=''};im.onerror=()=>{alert('Unable to read this image');URL.revokeObjectURL(url)};im.src=url};
$('add').onclick=()=>addLayer();$('delete').onclick=()=>{if(!active())return;checkpoint();layers=layers.filter(l=>l.id!==selected);selected=layers.at(-1)?.id??null;refresh()};
function shift(d){const i=layers.findIndex(l=>l.id===selected),j=i+d;if(i<0||j<0||j>=layers.length)return;checkpoint();[layers[i],layers[j]]=[layers[j],layers[i]];refresh()}$('up').onclick=()=>shift(1);$('down').onclick=()=>shift(-1);
$('undo').onclick=()=>{if(!history.length)return;future.push(capture());restore(history.pop())};$('redo').onclick=()=>{if(!future.length)return;history.push(capture());restore(future.pop())};
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.style.outline='');b.style.outline='2px solid #a19cff'});
$('size').oninput=e=>$('sizeval').textContent=e.target.value;$('zoom').oninput=e=>{canvas.style.width=(canvas.width*Number(e.target.value)/100)+'px';canvas.style.maxWidth='none';canvas.style.maxHeight='none'};$('fit').onclick=()=>{canvas.style.width='';canvas.style.maxWidth='100%';canvas.style.maxHeight='100%';$('zoom').value=100};
for(const prop of ['opacity','brightness','contrast']){const el=$(prop);el.onpointerdown=()=>{if(active())checkpoint()};el.oninput=()=>{const l=active();if(!l)return;l[prop]=prop==='opacity'?Number(el.value)/100:Number(el.value);refresh()}}
function pos(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.onpointerdown=e=>{const l=active();if(!l)return;checkpoint();drag=true;last=pos(e);canvas.setPointerCapture(e.pointerId);if(tool!=='move')paint(last,last)};
canvas.onpointermove=e=>{if(!drag)return;const l=active();if(!l)return;const p=pos(e);if(tool==='move'){l.x+=p.x-last.x;l.y+=p.y-last.y;render()}else paint(last,p);last=p};canvas.onpointerup=()=>{drag=false;refresh()};canvas.onpointercancel=()=>{drag=false;refresh()};
function paint(a,b){const l=active(),c=l.canvas.getContext('2d');c.save();c.lineWidth=Number($('size').value);c.lineCap='round';c.lineJoin='round';c.strokeStyle=$('color').value;if(tool==='erase')c.globalCompositeOperation='destination-out';c.beginPath();c.moveTo(a.x-l.x,a.y-l.y);c.lineTo(b.x-l.x,b.y-l.y);if(a.x===b.x&&a.y===b.y){c.lineTo(b.x-l.x+0.01,b.y-l.y+0.01)}c.stroke();c.restore();render()}
$('text').onclick=()=>{const value=prompt('Text to add');if(!value)return;const l=addLayer('Text: '+value.slice(0,20)),c=l.canvas.getContext('2d');c.fillStyle=$('color').value;c.font='bold 64px sans-serif';c.fillText(value,60,120);refresh()};
$('rectangle').onclick=()=>{const l=addLayer('Rectangle'),c=l.canvas.getContext('2d');c.fillStyle=$('color').value;c.fillRect(80,80,280,180);refresh()};
$('rotate').onclick=()=>{const l=active();if(!l)return;checkpoint();const tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=canvas.height;const t=tmp.getContext('2d');t.translate(canvas.width/2,canvas.height/2);t.rotate(Math.PI/2);t.drawImage(l.canvas,-canvas.height/2,-canvas.width/2,canvas.height,canvas.width);l.canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);l.canvas.getContext('2d').drawImage(tmp,0,0);refresh()};
$('flip').onclick=()=>{const l=active();if(!l)return;checkpoint();const tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=canvas.height;const t=tmp.getContext('2d');t.translate(tmp.width,0);t.scale(-1,1);t.drawImage(l.canvas,0,0);l.canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);l.canvas.getContext('2d').drawImage(tmp,0,0);refresh()};
$('save').onclick=()=>{render();const a=document.createElement('a');a.download='photosoap-design.png';a.href=canvas.toDataURL('image/png');a.click()};
function download(data,name){const a=document.createElement('a');a.download=name;a.href=data;a.click()}
$('jpg').onclick=()=>{render();const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(canvas,0,0);download(c.toDataURL('image/jpeg',.92),'photosoap-design.jpg')};
$('project').onclick=()=>{const data=JSON.stringify({format:'photosoap',version:1,...capture()});const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));download(url,'photosoap-project.json');setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('loadproject').onclick=()=>$('projectfile').click();
$('projectfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.format!=='photosoap'||data.version!==1||!Array.isArray(data.layers)||!Number.isInteger(data.width)||!Number.isInteger(data.height)||data.width<1||data.height<1||data.width>6000||data.height>6000||data.width*data.height>16000000||data.layers.length>50||data.layers.some(l=>typeof l.data!=='string'||!l.data.startsWith('data:image/png;base64,')||l.data.length>50000000))throw Error('Invalid or unsupported project');checkpoint();await restore(data)}catch(err){alert('Could not open project: '+err.message)}e.target.value=''};
$('duplicate').onclick=()=>{const l=active();if(!l)return;const n=addLayer(l.name+' copy');n.canvas.getContext('2d').drawImage(l.canvas,0,0);n.x=l.x;n.y=l.y;n.opacity=l.opacity;n.brightness=l.brightness;n.contrast=l.contrast;refresh()};
$('clear').onclick=()=>{const l=active();if(!l)return;checkpoint();l.canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);refresh()};
$('resize').onclick=()=>{const w=Number(prompt('New width in pixels (1–6000)',canvas.width)),h=Number(prompt('New height in pixels (1–6000)',canvas.height));if(!Number.isInteger(w)||!Number.isInteger(h)||w<1||h<1||w>6000||h>6000||w*h>16000000)return;checkpoint();layers.forEach(l=>{const old=l.canvas;const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(old,0,0,w,h);l.canvas=c;l.x=l.x*w/canvas.width;l.y=l.y*h/canvas.height});canvas.width=w;canvas.height=h;refresh()};
$('crop').onclick=()=>{const w=Number(prompt('Crop width',Math.round(canvas.width*.8))),h=Number(prompt('Crop height',Math.round(canvas.height*.8)));if(!Number.isInteger(w)||!Number.isInteger(h)||w<1||h<1||w>canvas.width||h>canvas.height)return;checkpoint();const ox=Math.floor((canvas.width-w)/2),oy=Math.floor((canvas.height-h)/2);layers.forEach(l=>{const old=l.canvas;const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(old,-ox,-oy);l.canvas=c;l.x-=ox;l.y-=oy});canvas.width=w;canvas.height=h;refresh()};
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)$('redo').click();else $('undo').click()}});
const base=layer('Background');base.canvas.getContext('2d').fillStyle='#ffffff';base.canvas.getContext('2d').fillRect(0,0,canvas.width,canvas.height);layers.push(base);selected=base.id;refresh();recoverAutosave();
</script></body></html>
