<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let multiSelected=new Set();let layers=[],selected=null,tool='move',drag=false,last=null,history=[],future=[],counter=0;let autosaveHandle=null;let selection=null;let selectionOrigin=null;let panMode=false,panStart=null;let autosaveWarning='';const MAX_PIXELS=16000000,MAX_LAYERS=50;
function layer(name){const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;return {id:++counter,name,canvas:c,x:0,y:0,opacity:1,brightness:100,contrast:100,visible:true,locked:false}}
function capture(){return {format:'photosoap',version:2,width:canvas.width,height:canvas.height,selected,layers:layers.map(l=>({id:l.id,name:l.name,x:l.x,y:l.y,opacity:l.opacity,brightness:l.brightness,contrast:l.contrast,visible:l.visible,locked:!!l.locked,groupId:l.groupId||undefined,textData:l.textData||undefined,shapeData:l.shapeData||undefined,elementData:l.elementData||undefined,data:l.canvas.toDataURL()}))}}
function validateDocument(s){if(!s||typeof s!=='object'||Array.isArray(s)||s.format&&s.format!=='photosoap'||![1,2].includes(s.version??1)||!Number.isInteger(s.width)||!Number.isInteger(s.height)||s.width<1||s.height<1||s.width>6000||s.height>6000||s.width*s.height>MAX_PIXELS||!Array.isArray(s.layers)||s.layers.length>MAX_LAYERS||s.width*s.height*s.layers.length>48000000)throw Error('Invalid document');const ids=new Set();for(const l of s.layers){if(!l||typeof l!=='object'||Array.isArray(l))throw Error('Invalid layer');if(!Number.isSafeInteger(l.id)||l.id<1||ids.has(l.id)||typeof l.name!=='string'||l.name.length>200||typeof l.data!=='string'||!/^data:image\/png;base64,[A-Za-z0-9+/]+=*$/.test(l.data)||l.data.length>50000000||![l.x,l.y,l.opacity,l.brightness,l.contrast].every(Number.isFinite)||Math.abs(l.x)>12000||Math.abs(l.y)>12000||l.opacity<0||l.opacity>1||l.brightness<0||l.brightness>200||l.contrast<0||l.contrast>200||('visible' in l&&typeof l.visible!=='boolean')||('locked' in l&&typeof l.locked!=='boolean'))throw Error('Invalid layer');if(l.groupId!==undefined&&(!Number.isSafeInteger(l.groupId)||l.groupId<1))throw Error('Invalid layer group');if(l.textData!==undefined){const t=l.textData;if(!t||typeof t!=='object'||typeof t.value!=='string'||t.value.length>10000||!Number.isFinite(t.size)||t.size<8||t.size>300||!['Arial','Georgia','Verdana','Trebuchet MS','Courier New'].includes(t.font)||!['400','700'].includes(t.weight)||!['left','center','right'].includes(t.align)||!/^#[0-9a-fA-F]{6}$/.test(t.color)||(t.leading!==undefined&&(!Number.isFinite(t.leading)||t.leading<.8||t.leading>3))||(t.tracking!==undefined&&(!Number.isFinite(t.tracking)||t.tracking< -5||t.tracking>30)))throw Error('Invalid text layer')}if(l.shapeData!==undefined){const d=l.shapeData;if(!d||!['rectangle','ellipse','line'].includes(d.kind)||![d.x,d.y,d.w,d.h,d.stroke].every(Number.isFinite)||d.w<=0||d.h<=0||d.stroke<1||d.stroke>100||![d.x,d.y,d.w,d.h].every(n=>Math.abs(n)<=12000)||!/^#[0-9a-fA-F]{6}$/.test(d.color))throw Error('Invalid shape layer')}if(l.elementData!==undefined){const d=l.elementData;if(!d||!['star','heart','triangle','arrow','diamond','hexagon','plus','chevron','pentagon','octagon','parallelogram','trapezoid'].includes(d.kind)||![d.x,d.y,d.w,d.h].every(Number.isFinite)||d.w<=0||d.h<=0||![d.x,d.y,d.w,d.h].every(n=>Math.abs(n)<=12000)||!/^#[0-9a-fA-F]{6}$/.test(d.color))throw Error('Invalid element layer')}ids.add(l.id)}if(s.selected!=null&&(!Number.isSafeInteger(s.selected)||!ids.has(s.selected)))throw Error('Invalid selected layer');return {format:'photosoap',version:2,width:s.width,height:s.height,selected:s.selected??null,layers:s.layers.map(l=>({id:l.id,name:l.name,data:l.data,x:l.x,y:l.y,opacity:l.opacity,brightness:l.brightness,contrast:l.contrast,visible:l.visible!==false,locked:!!l.locked,groupId:l.groupId,textData:l.textData,shapeData:l.shapeData,elementData:l.elementData}))}}
async function restore(s){s=validateDocument(s);const rebuilt=await Promise.all(s.layers.map(async l=>{const im=new Image();await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=l.data});if(im.naturalWidth!==s.width||im.naturalHeight!==s.height)throw Error('Layer image dimensions do not match document');const c=document.createElement('canvas');c.width=s.width;c.height=s.height;c.getContext('2d').drawImage(im,0,0);return {...l,canvas:c}}));canvas.width=s.width;canvas.height=s.height;selected=rebuilt.some(l=>l.id===s.selected)?s.selected:(rebuilt.at(-1)?.id??null);layers=rebuilt;selection=null;counter=Math.max(counter,0,...layers.map(l=>Number(l.id)||0));refresh()}
// Phase 2 page preview: independent page snapshots, without changing the v2 project format.
let pageRecords=[],pageIndex=0,pageSequence=1,pageSwitching=false;
function rememberPage(){if(pageRecords.length)pageRecords[pageIndex].snapshot=capture()}
function updatePagePicker(){const picker=$('pagepicker');picker.innerHTML='';pageRecords.forEach((p,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=p.name;picker.append(option)});picker.value=String(pageIndex)}
async function switchPage(index){if(pageSwitching||index===pageIndex||!pageRecords[index])return;pageSwitching=true;const previous=pageIndex;rememberPage();try{await restore(pageRecords[index].snapshot);pageIndex=index;history=[];future=[];updateButtons();updatePagePicker()}catch(err){pageIndex=previous;updatePagePicker();alert('Cannot open page: '+err.message)}finally{pageSwitching=false}}
$('pagepicker').onchange=e=>switchPage(Number(e.target.value));
$('pageexport').onclick=async()=>{if(pageSwitching)return;rememberPage();const previous=pageIndex;pageSwitching=true;try{for(let i=0;i<pageRecords.length;i++){const snapshot=validateDocument(pageRecords[i].snapshot);await restore(snapshot);render(false);const filename='photosoap-page-'+String(i+1).padStart(2,'0')+'.png';download(canvas.toDataURL('image/png'),filename)}await restore(pageRecords[previous].snapshot);pageIndex=previous;updatePagePicker()}catch(err){try{await restore(pageRecords[previous].snapshot)}catch{}pageIndex=previous;updatePagePicker();alert('Page export failed: '+err.message)}finally{pageSwitching=false;render()}};
function zipCRC(bytes){let crc=0xffffffff;for(const b of bytes){crc^=b;for(let k=0;k<8;k++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}return (crc^0xffffffff)>>>0}
function makeZip(entries){const enc=new TextEncoder(),parts=[],central=[];let offset=0;for(const entry of entries){const name=enc.encode(entry.name),data=entry.bytes,crc=zipCRC(data);const local=new Uint8Array(30+name.length),v=new DataView(local.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);local.set(name,30);parts.push(local,data);const cd=new Uint8Array(46+name.length),c=new DataView(cd.buffer);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,offset,true);cd.set(name,46);central.push(cd);offset+=local.length+data.length}const centralSize=central.reduce((n,b)=>n+b.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,entries.length,true);v.setUint16(10,entries.length,true);v.setUint32(12,centralSize,true);v.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/zip'})}
$('pagezip').onclick=async()=>{if(pageSwitching)return;rememberPage();const previous=pageIndex;pageSwitching=true;try{const entries=[];for(let i=0;i<pageRecords.length;i++){await restore(validateDocument(pageRecords[i].snapshot));render(false);const response=await fetch(canvas.toDataURL('image/png'));entries.push({name:'photosoap-page-'+String(i+1).padStart(2,'0')+'.png',bytes:new Uint8Array(await response.arrayBuffer())})}const url=URL.createObjectURL(makeZip(entries));download(url,'photosoap-pages.zip');setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(err){alert('ZIP export failed: '+err.message)}finally{await restore(pageRecords[previous].snapshot);pageIndex=previous;updatePagePicker();pageSwitching=false;render()}};
function pdfBytes(images){const enc=new TextEncoder(),parts=[],offsets=[0];let length=0;const add=b=>{parts.push(b);length+=b.length},ascii=t=>add(enc.encode(t));ascii('%PDF-1.4\n');const count=images.length,root=1,pages=2;const obj=(n,body)=>{offsets[n]=length;ascii(n+' 0 obj\n'+body+'\nendobj\n')};obj(root,'<< /Type /Catalog /Pages 2 0 R >>');obj(pages,'<< /Type /Pages /Count '+count+' /Kids ['+images.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>');images.forEach((im,i)=>{const n=3+i*3,w=im.width,h=im.height,stream=enc.encode('q '+w+' 0 0 '+h+' 0 0 cm /Im0 Do Q\n');obj(n,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+w+' '+h+'] /Resources << /XObject << /Im0 '+(n+2)+' 0 R >> >> /Contents '+(n+1)+' 0 R >>');offsets[n+1]=length;ascii((n+1)+' 0 obj\n<< /Length '+stream.length+' >>\nstream\n');add(stream);ascii('endstream\nendobj\n');offsets[n+2]=length;ascii((n+2)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+' >>\nstream\n');add(im.bytes);ascii('\nendstream\nendobj\n')});const start=length;ascii('xref\n0 '+offsets.length+'\n0000000000 65535 f \n');for(let i=1;i<offsets.length;i++)ascii(String(offsets[i]).padStart(10,'0')+' 00000 n \n');ascii('trailer\n<< /Size '+offsets.length+' /Root 1 0 R >>\nstartxref\n'+start+'\n%%EOF');return new Blob(parts,{type:'application/pdf'})}
$('pagepdf').onclick=async()=>{if(pageSwitching)return;rememberPage();const previous=pageIndex;pageSwitching=true;try{const images=[];for(const record of pageRecords){await restore(validateDocument(record.snapshot));render(false);const response=await fetch(canvas.toDataURL('image/jpeg',0.92));images.push({width:canvas.width,height:canvas.height,bytes:new Uint8Array(await response.arrayBuffer())})}const url=URL.createObjectURL(pdfBytes(images));download(url,'photosoap-pages.pdf');setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(err){alert('PDF export failed: '+err.message)}finally{await restore(pageRecords[previous].snapshot);pageIndex=previous;updatePagePicker();pageSwitching=false;render()}};

$('rotateobject').onclick=()=>{const l=layers.find(item=>item.id===selected);if(!l){alert('Select a layer');return}if(l.locked){alert('Unlock the layer first');return}const raw=prompt('Rotation in degrees (-180 to 180)','90');if(raw===null)return;const deg=Number(raw);if(!Number.isFinite(deg)||deg<-180||deg>180){alert('Enter an angle between -180 and 180');return}if(l.shapeData||l.elementData){const members=l.groupId?layers.filter(item=>item.groupId===l.groupId):[l];if(members.some(item=>item.locked)){alert('Unlock all grouped layers first');return}const editable=members.filter(item=>item.shapeData||item.elementData);if(editable.length!==members.length){alert('Group rotation currently requires editable vector objects');return}const bounds=editable.map(item=>{const d=item.shapeData||item.elementData;return {x:d.x+item.x,y:d.y+item.y,right:d.x+d.w+item.x,bottom:d.y+d.h+item.y}});const cx=(Math.min(...bounds.map(v=>v.x))+Math.max(...bounds.map(v=>v.right)))/2,cy=(Math.min(...bounds.map(v=>v.y))+Math.max(...bounds.map(v=>v.bottom)))/2,rad=deg*Math.PI/180;const updates=editable.map(item=>{const d=item.shapeData||item.elementData,px=d.x+item.x+d.w/2-cx,py=d.y+item.y+d.h/2-cy;return {item,x:cx+px*Math.cos(rad)-py*Math.sin(rad)-d.w/2-item.x,y:cy+px*Math.sin(rad)+py*Math.cos(rad)-d.h/2-item.y}});if(updates.some(v=>Math.abs(v.x)>12000||Math.abs(v.y)>12000)){alert('Rotation exceeds position limits');return}checkpoint();for(const v of updates){const d=v.item.shapeData||v.item.elementData;d.x=v.x;d.y=v.y;d.rotation=((d.rotation||0)+deg+360)%360;if(v.item.shapeData)drawShapeLayer(v.item);else drawElementLayer(v.item)}refresh();return}checkpoint();const old=l.canvas,rotated=document.createElement('canvas');rotated.width=old.width;rotated.height=old.height;const c=rotated.getContext('2d');c.translate(old.width/2,old.height/2);c.rotate(deg*Math.PI/180);c.drawImage(old,-old.width/2,-old.height/2);l.canvas=rotated;l.shapeData=undefined;l.elementData=undefined;l.textData=undefined;l.na $('flipobject').onclick=()=>{const l=layers.find(item=>item.id===selected);if(!l){alert('Select a layer');return}if(l.locked){alert('Unlock the layer first');return}const mode=prompt('Flip horizontally or vertically? (h/v)','h');if(mode===null)return;const direction=mode.trim().toLowerCase();if(!['h','v'].includes(direction)){alert('Enter h or v');return}if(l.shapeData||l.elementData){checkpoint();const d=l.shapeData||l.elementData;if(direction==='h')d.flipH=!d.flipH;else d.flipV=!d.flipV;if(l.shapeData)drawShapeLayer(l);else drawElementLayer(l);refresh();return}checkpoint();const old=l.canvas,c=document.createElement('canvas');c.width=old.width;c.height=old.height;const x=c.getContext('2d');if(direction==='h'){x.translate(c.width,0);x.scale(-1,1)}else{x.translate(0,c.height);x.scale(1,-1)}x.drawImage(old,0,0);l.canvas=c;l.shapeData=undefined;l.elementData=undefined;l.textData=undefined;l.name+=' (flipped)';refresh()};
function moveLayerSet(dx,dy){const l=active();if(!l){alert('Select a layer');return}const members=l.groupId?layers.filter(item=>item.groupId===l.groupId):[l];if(members.some(item=>item.locked)){alert('Unlock all affected layers first');return}if(members.some(item=>{const d=item.shapeData||item.elementData;return (d?[d.x+dx,d.y+dy]:[item.x+dx,item.y+dy]).some(v=>Math.abs(v)>12000)})){alert('Position exceeds limits');return}checkpoint();for(const item of members){const d=item.shapeData||item.elementData;if(d){d.x+=dx;d.y+=dy;if(item.shapeData)drawShapeLayer(item);else drawElementLayer(item)}else{item.x+=dx;item.y+=dy}}refresh()}
$('moveobject').onclick=()=>{if(!active()){alert('Select a layer');return}const raw=prompt('Move by X,Y pixels (example: 20,-10)','20,0');if(raw===null)return;const parts=raw.split(',').map(v=>Number(v.trim()));if(parts.length!==2||parts.some(v=>!Number.isFinite(v)||Math.abs(v)>12000)){alert('Enter two valid pixel offsets');return}moveLayerSet(parts[0],parts[1])};
$('nudgeobject').onclick=()=>{if(!active()){alert('Select a layer');return}const raw=prompt('Nudge direction (left/right/up/down), optionally followed by pixels (e.g. right 5)','right 1');if(raw===null)return;const match=/^(left|right|up|down)(?:\\s+(\\d+(?:\\.\\d+)?))?$/i.exec(raw.trim());if(!match){alert('Use a direction and optional pixel distance');return}const n=match[2]===undefined?1:Number(match[2]);if(!Number.isFinite(n)||n<=0||n>1000){alert('Distance must be between 0 and 1000 pixels');return}const direction=match[1].toLowerCase();moveLayerSet(direction==='left'?-n:direction==='right'?n:0,direction==='up'?-n:direction==='down'?n:0)};
$('setobjectposition').onclick=()=>{const l=layers.find(item=>item.id===selected);if(!l){alert('Select a layer');return}if(l.locked){alert('Unlock the layer first');return}const d=l.shapeData||l.elementData,old=d?[d.x,d.y]:[l.x,l.y];const raw=prompt('Absolute X,Y position in pixels',old.join(','));if(raw===null)return;const values=raw.split(',').map(v=>Number(v.trim()));if(values.length!==2||values.some(v=>!Number.isFinite(v)||Math.abs(v)>12000)){alert('Enter two valid positions within ±12000 pixels');return}checkpoint();if(d){d.x=values[0];d.y=values[1];if(l.shapeData)drawShapeLayer(l);else drawElementLayer(l)}else{l.x=values[0];l.y=values[1]}refresh()};
$('resizeobject').onclick=()=>{const l=layers.find(item=>item.id===selected);if(!l||(!l.shapeData&&!l.elementData)){alert('Select an editable shape or element');return}if(l.locked){alert('Unlock the layer first');return}const d=l.shapeData||l.elementData;const raw=prompt('Width,Height in pixels',[d.w,d.h].join(','));if(raw===null)return;const n=raw.split(',').map(v=>Number(v.trim()));if(n.length!==2||n.some(v=>!Number.isFinite(v)||v<=0||v>12000)){alert('Enter positive width and height up to 12000 pixels');return}checkpoint();d.w=n[0];d.h=n[1];if(l.shapeData)drawShapeLayer(l);else drawElementLayer(l);refresh()};
const BRAND_KEY='photosoap-brand-kit-v1';const brandSlotKey=()=>BRAND_KEY+':'+$('brandslot').value;function validBrand(b){return b&&/^#[0-9a-fA-F]{6}$/.test(b.primary)&&/^#[0-9a-fA-F]{6}$/.test(b.secondary)&&['Arial','Georgia','Verdana','Trebuchet MS','Courier New'].includes(b.font)}

$('applybrand').onclick=()=>{let b;try{b=JSON.parse(localStorage.getItem(brandSlotKey())||($('brandslot').value==='1'?localStorage.getItem(BRAND_KEY):null)||'null')}catch{}if(!validBrand(b)){alert('Save a brand kit first');return}$('brandprimary').value=b.primary;$('brandsecondary').value=b.secondary;$('brandfont').value=b.font;$('color').value=b.primary;$('textfont').value=b.font;alert('Brand colors and font loaded into editor controls')};
const brandNameKey=()=>brandSlotKey()+':name';const updateBrandName=()=>{$('brandname').textContent=localStorage.getItem(brandNameKey())||'Brand '+$('brandslot').value};$('renamebrand').onclick=()=>{const raw=prompt('Brand kit name',localStorage.getItem(brandNameKey())||'Brand '+$('brandslot').value);if(raw===null)return;const name=raw.trim();if(!name||name.length>60){alert('Enter a name of 1 to 60 characters');return}try{localStorage.setItem(brandNameKey(),name);updateBrandName()}catch(e){alert('Could not save brand name: '+e.message)}};const loadBrandSlot=()=>{try{const savedBrand=JSON.parse(localStorage.getItem(brandSlotKey())||($('brandslot').value==='1'?localStorage.getItem(BRAND_KEY):null)||'null');if(validBrand(savedBrand)){$('brandprimary').value=savedBrand.primary;$('brandsecondary').value=savedBrand.secondary;$('brandfont').value=savedBrand.font}}catch{}};$('brandslot').onchange=()=>{loadBrandSlot();updateBrandName()};loadBrandSlot();updateBrandName();
$('applytemplate').onclick=()=>{const kind=$('designtemplate').value;const specs={announcement:{heading:'BIG NEWS',subtitle:'Add your announcement here',accent:'#2563eb'},quote:{heading:'YOUR QUOTE',subtitle:'— Your name',accent:'#7c3aed'},sale:{heading:'SPECIAL OFFER',subtitle:'Limited time only',accent:'#dc2626'},event:{heading:'YOU ARE INVITED',subtitle:'Date · Time · Location',accent:'#0f766e'},launch:{heading:'INTRODUCING',subtitle:'Your next big thing',accent:'#4338ca'},thankyou:{heading:'THANK YOU',subtitle:'We appreciate your support',accent:'#be185d'},workshop:{heading:'JOIN THE WORKSHOP',subtitle:'Learn · Create · Connect',accent:'#b45309'},birthday:{heading:'HAPPY BIRTHDAY',subtitle:'Wishing you a wonderful day',accent:'#9333ea'}};const spec=specs[kind];if(!spec)return;if(layers.length+3>MAX_LAYERS||(layers.length+3)*canvas.width*canvas.height>48000000){alert('Not enough layer capacity for template');return}const w=canvas.width,h=canvas.height;const shape=addLayer('Template accent');const accentY=kind==='sale'||kind==='launch'?Math.round(h*.14):kind==='birthday'||kind==='thankyou'?Math.round(h*.74):Math.round(h*.22);shape.shapeData={kind:'rectangle',x:Math.round(w*.08),y:accentY,w:Math.round(w*.84),h:Math.max(8,Math.round(h*.025)),color:spec.accent,stroke:12};drawShapeLayer(shape);const addTemplateText=(value,size,y)=>{const l=addLayer('Template: '+value);l.textData={value,size,font:'Arial',weight:'700',align:'center',color:spec.accent};drawTextLayer(l);l.y=y;return l};addTemplateText(spec.heading,Math.max(24,Math.min(100,Math.round(w*.075))),Math.round(h*(kind==='sale'||kind==='launch'?.26:.32)));const subtitle=addTemplateText(spec.subtitle,Math.max(16,Math.min(52,Math.round(w*.035))),Math.round(h*(kind==='birthday'||kind==='thankyou'?.49:.53)));subtitle.textData.weight='400';subtitle.textData.color='#333333';drawTextLayer(subtitle);refresh()};

$('project').onclick=()=>{rememberPage();const data=JSON.stringify({format:'photosoap',version:3,activePage:pageIndex,pages:pageRecords.map(p=>({name:p.name,document:p.snapshot}))});const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));download(url,'photosoap-project.json');setTimeout(()=>URL.revokeObjectURL(url),1000)};

$('projectfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());let incoming;if(data.format==='photosoap'&&data.version===3){if(!Array.isArray(data.pages)||data.pages.length<1||data.pages.length>20||!Number.isInteger(data.activePage)||data.activePage<0||data.activePage>=data.pages.length)throw Error('Invalid pages');incoming=data.pages.map(p=>{if(!p||typeof p.name!=='string'||!p.name.trim()||p.name.length>80)throw Error('Invalid page name');return {name:p.name,snapshot:validateDocument(p.document)}})}else{incoming=[{name:'Page 1',snapshot:validateDocument(data)}]}const target=data.version===3?data.activePage:0;await restore(incoming[target].snapshot);pageRecords=incoming;pageIndex=target;pageSequence=incoming.length;history=[];future=[];updateButtons();updatePagePicker()}catch(err){alert('Could not open project: '+err.message)}e.target.value=''};

$('duplicate').onclick=()=>{const l=active();if(!l)return;const n=addLayer(l.name+' copy');if(!n)return;n.canvas.getContext('2d').drawImage(l.canvas,0,0);n.x=l.x;n.y=l.y;n.opacity=l.opacity;n.brightness=l.brightness;n.contrast=l.contrast;n.visible=l.visible;n.textData=l.textData?{...l.textData}:undefined;n.shapeData=l.shapeData?{...l.shapeData}:undefined;n.elementData=l.elementData?{...l.elementData}:undefined;refresh()};
$('offsetduplicate').onclick=()=>{const l=active(),offset=Number($('duplicateoffset').value);if(!l||!Number.isInteger(offset)||Math.abs(offset)>1000){alert('Select a layer and enter an offset between -1000 and 1000');return}if(Math.abs(l.x+offset)>12000||Math.abs(l.y+offset)>12000){alert('Duplicate position exceeds the document limit');return}const n=addLayer(l.name+' copy');if(!n)return;n.canvas.getContext('2d').drawImage(l.canvas,0,0);n.textData=l.textData?{...l.textData}:undefined;n.shapeData=l.shapeData?{...l.shapeData}:undefined;n.elementData=l.elementData?{...l.elementData}:undefined;n.x=l.x+offset;n.y=l.y+offset;n.opacity=l.opacity;n.brightness=l.brightness;n.contrast=l.contrast;n.visible=l.visible;n.locked=false;refresh()};

function resizeDesign(w,h){if(!Number.isInteger(w)||!Number.isInteger(h)||w<1||h<1||w>6000||h>6000||w*h>MAX_PIXELS||w*h*layers.length>48000000){alert('Design dimensions exceed the canvas or layer memory limit');return false}if(w===canvas.width&&h===canvas.height)return true;checkpoint();const oldW=canvas.width,oldH=canvas.height;layers.forEach(l=>{const old=l.canvas,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(old,0,0,w,h);l.canvas=c;l.x=l.x*w/oldW;l.y=l.y*h/oldH});canvas.width=w;canvas.height=h;selection=null;refresh();return true}

$('applyposition').onclick=()=>{const l=active();if(!l||l.locked){alert('Select an unlocked layer to position');return}const x=Number($('layerx').value),y=Number($('layery').value);if(!Number.isInteger(x)||!Number.isInteger(y)||Math.abs(x)>12000||Math.abs(y)>12000){alert('Position must be an integer between -12000 and 12000');return}const spacing=Math.max(5,Math.min(500,Number($('gridsize').value)||50));const nx=$('snapgrid').checked?Math.round(x/spacing)*spacing:x,ny=$('snapgrid').checked?Math.round(y/spacing)*spacing:y;if(l.x===nx&&l.y===ny)return;checkpoint();l.x=nx;l.y=ny;refresh()};
$('applyalign').onclick=()=>{const l=active();if(!l||l.locked){alert('Select an unlocked layer to align');return}const mode=$('alignlayer').value;const w=l.canvas.width,h=l.canvas.height;let x=l.x,y=l.y;switch(mode){case 'center':x=(canvas.width-w)/2;y=(canvas.height-h)/2;break;case 'left':x=0;break;case 'right':x=canvas.width-w;break;case 'top':y=0;break;case 'bottom':y=canvas.height-h;break;case 'hcenter':x=(canvas.width-w)/2;break;case 'vcenter':y=(canvas.height-h)/2;break;default:return}if(x===l.x&&y===l.y)return;checkpoint();l.x=x;l.y=y;refresh()};
