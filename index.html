<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e9edf5;background:#11141b}*{box-sizing:border-box}body{margin:0}header{height:58px;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#1d2330;border-bottom:1px solid #353e4c}button,input{font:inherit}button{background:#303b4d;color:#fff;border:1px solid #485467;border-radius:7px;padding:8px 11px;cursor:pointer}button:hover{background:#42516a}button:disabled{opacity:.4;cursor:default}button.primary{background:#6861e8;border-color:#8883ff}header strong{margin-right:auto;font-size:19px}main{display:grid;grid-template-columns:210px minmax(0,1fr)260px;height:calc(100vh - 58px)}aside{background:#1d2330;padding:16px;overflow:auto}aside:first-child{border-right:1px solid #353e4c}aside:last-child{border-left:1px solid #353e4c}h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#b5bfd1}label{display:block;font-size:12px;color:#b5bfd1;margin:12px 0 5px}input[type=range]{width:100%}#preset,#alignlayer{width:100%;background:#303b4d;color:#fff;border:1px solid #485467;border-radius:7px;padding:8px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stage{background-color:#252b35;background-image:linear-gradient(45deg,#303744 25%,transparent 25%),linear-gradient(-45deg,#303744 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#303744 75%),linear-gradient(-45deg,transparent 75%,#303744 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:24px}canvas{flex-shrink:0;touch-action:none;max-width:100%;max-height:100%;box-shadow:0 8px 30px #0008;cursor:crosshair}#layers{list-style:none;padding:0}#layers li{padding:10px;border:1px solid #404a5b;border-radius:7px;margin:7px 0;cursor:pointer;display:flex;justify-content:space-between;gap:6px}#layers li.active{border-color:#958fff;background:#343456}.muted{font-size:12px;color:#aab6c9;line-height:1.6}.row{display:flex;gap:6px;flex-wrap: <header><strong>◈ PhotoSoap <span style="font-weight:400;color:#b9c2d4">Studio</span></strong><button id="open">Open image</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="project">Save project</button><button id="loadproject">Open project</button><button id="jpg">Export JPG</button><button id="save" class="primary">Export PNG</button><input id="projectfile" type="file" accept=".json,application/json" hidden><input id="file" type="file" accept="image/*" hidden></header>
<main><aside><h3>Tools</h3><div class="tools"><button data-tool="move">Move</button><button data-tool="brush">Brush</button><button data-tool="erase">Erase</button><button id="text">Add text</button><button id="rectangle">Rectangle</button><button id="ellipse">Ellipse</button><button id="line">Line</button><button id="rotate">Rotate 90°</button><button id="flip">Flip H</button><button id="fit">Reset view</button><button id="pan">Pan view</button><button id="crop">Crop selection</button><button id="selectall">Select all</button><button data-tool="select">Select area</button><button id="deselect">Deselect</button><button id="resize">Resize canvas</button><label for="preset">Design size</label><select id="preset" aria-label="Design canvas size"><option value="1080x1080">Square post · 1080×1080</option><option value="1080x1920">Story · 1080×1920</option><option value="1920x1080">Presentation · 1920×1080</option><option value="1200x628">Social banner · 1200×628</option><option value="794x1123">A4 preview · 794×1123</option></select><button id="applypreset">Apply design size</button><label for="alignlayer">Align selected layer</label><select id="alignlayer" aria-label="Layer alignment"><option value="center">Center on canvas</option><option value="left">Align left</option><option value="right">Align right</option><option value="top">Align top</option><option value="bottom">Align bottom</option><option value="hcenter">Center horizontally</option><option value="vcenter">Center vertically</option></select><button id="applyalign">Align layer</button><label for="layerx">Layer position X (px)</label><input id="layerx" type="number" step="1" min="-12000" max="12000" value="0"><label for="layery">Layer position Y (px)</label><input id="layery" type="number" step="1" min="-12000" max="12000" value="0"><button id="applyposition">Set position</button><label for="duplicateoffset">Duplicate offset (px)</label><input id="duplicateoffset" type="number" min="-1000" max="1000" step="1" value="24"><button id="offsetduplicate">Duplicate with offset</button><label><input id="showgrid" type="checkbox"> Show design grid</label><label for="gridsize">Grid spacing (px)</label><input id="gridsize" type="number" min="5" max="500" step="1" value="50"><label><input id="snapgrid" type="checkbox"> Snap position to grid</label><label><input id="snapcenter" type="checkbox"> Snap dragged layers to canvas center</label><button id="duplicate">Duplicate</button><button id="lock">Lock layer</button><button id="clear">Clear layer</button></div><label for="size">Brush size <span id="sizeval">12</span> px</label><input id="size" type="range" min="1" max="100" value="12"><label for="color">Brush color</label><input id="color" type="color" value="#e85082"><label for="bgcolor">Canvas background</label><input id="bgcolor" type="color" value="#ffffff"><button id="background">Set background</button><label for="zoom">Zoom</label><input id="zoom" type="range" min="20" max="200" value="100"><p class="muted">Choose a layer, then use Move to drag it. Brush and Erase paint on the selected layer. Changes can be undone.</p></aside>
<section class="stage"><canvas id="canvas" width="1000" height="700" role="img" aria-label="Photo editing canvas; use Select area to drag a selection, or Select all for keyboard access"></canvas></section>
<aside><h3>Layers</h3><div class="row"><button id="add">+ Layer</button><button id="delete">Delete</button><button id="up">↑</button><button id="down">↓</button></div><ul id="layers"></ul><h3>Adjust selected layer</h3><label for="opacity">Opacity <span id="opacityval">100%</span></label><input id="opacity" type="range" min="0" max="100" value="100"><label for="brightness">Brightness <span id="brightnessval">100%</span></label><input id="brightness" type="range" min="0" max="200" value="100"><label for="contrast">Contrast <span id="contrastval">100%</span></label><input id="contrast" type="range" min="0" max="200" value="100"><p id="status" role="status"></p></aside></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let layers=[],selected=null,tool='move',drag=false,last=null,history=[],future=[],counter=0;let autosaveHandle=null;let selection=null;let selectionOrigin=null;let panMode=false,panStart=null;let autosaveWarning='';const MAX_PIXELS=16000000,MAX_LAYERS=50;
function layer(name){const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;return {id:++counter,name,canvas:c,x:0,y:0,opacity:1,brightness:100,contrast:100,visible:true,locked:false}}
function capture(){return {format:'photosoap',version:2,width:canvas.width,height:canvas.height,selected,layers:layers.map(l=>({id:l.id,name:l.name,x:l.x,y:l.y,opacity:l.opacity,brightness:l.brightness,contrast:l.contrast,visible:l.visible,locked:!!l.locked,data:l.canvas.toDataURL()}))}}
function validateDocument(s){if(!s||typeof s!=='object'||Array.isArray(s)||s.format&&s.format!=='photosoap'||![1,2].includes(s.version??1)||!Number.isInteger(s.width)||!Number.isInteger(s.height)||s.width<1||s.height<1||s.width>6000||s.height>6000||s.width*s.height>MAX_PIXELS||!Array.isArray(s.layers)||s.layers.length>MAX_LAYERS||s.width*s.height*s.layers.length>48000000)throw Error('Invalid document');const ids=new Set();for(const l of s.layers){if(!l||typeof l!=='object'||Array.isArray(l))throw Error('Invalid layer');if(!Number.isSafeInteger(l.id)||l.id<1||ids.has(l.id)||typeof l.name!=='string'||l.name.length>200||typeof l.data!=='string'||!/^data:image\/png;base64,[A-Za-z0-9+/]+=*$/.test(l.data)||l.data.length>50000000||![l.x,l.y,l.opacity,l.brightness,l.contrast].every(Number.isFinite)||Math.abs(l.x)>12000||Math.abs(l.y)>12000||l.opacity<0||l.opacity>1||l.brightness<0||l.brightness>200||l.contrast<0||l.contrast>200||('visible' in l&&typeof l.visible!=='boolean')||('locked' in l&&typeof l.locked!=='boolean'))throw Error('Invalid layer');ids.add(l.id)}if(s.selected!=null&&(!Number.isSafeInteger(s.selected)||!ids.has(s.selected)))throw Error('Invalid selected layer');return {format:'photosoap',version:2,width:s.width,height:s.height,selected:s.selected??null,layers:s.layers.map(l=>({id:l.id,name:l.name,data:l.data,x:l.x,y:l.y,opacity:l.opacity,brightness:l.brightness,contrast:l.contrast,visible:l.visible!==false,locked:!!l.locked}))}}
async function restore(s){s=validateDocument(s);const rebuilt=await Promise.all(s.layers.map(async l=>{const im=new Image();await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=l.data});if(im.naturalWidth!==s.width||im.naturalHeight!==s.height)throw Error('Layer image dimensions do not match document');const c=document.createElement('canvas');c.width=s.width;c.height=s.height;c.getContext('2d').drawImage(im,0,0);return {...l,canvas:c}}));canvas.width=s.width;canvas.height=s.height;selected=rebuilt.some(l=>l.id===s.selected)?s.selected:(rebuilt.at(-1)?.id??null);layers=rebuilt;selection=null;counter=Math.max(counter,0,...layers.map(l=>Number(l.id)||0));refresh()}
function checkpoint(){const snapshot=capture();history.push(snapshot);const maxHistory=canvas.width*canvas.height*layers.length>8000000?3:12;while(history.length>maxHistory)history.shift();future=[];updateButtons()}
function updateButtons(){$('undo').disabled=!history.length;$('redo').disabled=!future.length}
function active(){return layers.find(l=>l.id===selected)}
function scheduleAutosave(){clearTimeout(autosaveHandle);autosaveHandle=setTimeout(()=>{try{const snapshot={format:'photosoap',version:2,...capture()};const encoded=JSON.stringify(snapshot);if(encoded.length<3500000){localStorage.setItem('photosoap-autosave-v1',encoded);autosaveWarning=''}else{autosaveWarning='Autosave unavailable for large project — save a project file';$('status').textContent=autosaveWarning}}catch(e){console.warn('Autosave unavailable',e)}},1200)}
async function recoverAutosave(){clearTimeout(autosaveHandle);try{const raw=localStorage.getItem('photosoap-autosave-v1');if(!raw)return;const saved=validateDocument(JSON.parse(raw));if(confirm('Restore your previous PhotoSoap session?'))await restore(saved);else localStorage.removeItem('photosoap-autosave-v1')}catch(e){console.warn('Recovery unavailable',e)}finally{scheduleAutosave()}}
function render(showSelection=true){ctx.clearRect(0,0,canvas.width,canvas.height);for(const l of layers){if(!l.visible)continue;ctx.save();ctx.globalAlpha=l.opacity;ctx.filter='brightness('+l.brightness+'%) contrast('+l.contrast+'%)';ctx.drawImage(l.canvas,l.x,l.y);ctx.restore()}if($('showgrid')?.checked){const spacing=Math.max(5,Math.min(500,Number($('gridsize').value)||50));ctx.save();ctx.strokeStyle='rgba(60,120,210,.4)';ctx.lineWidth=1;ctx.beginPath();for(let x=spacing;x<canvas.width;x+=spacing){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,canvas.height)}for(let y=spacing;y<canvas.height;y+=spacing){ctx.moveTo(0,y+.5);ctx.lineTo(canvas.width,y+.5)}ctx.stroke();ctx.restore()}if(showSelection&&selection){ctx.save();ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.rect(0,0,canvas.width,canvas.height);ctx.rect(selection.x,selection.y,selection.w,selection.h);ctx.fill('evenodd');ctx.restore();ctx.save();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.setLineDash([8,5]);ctx.strokeRect(selection.x,selection.y,selection.w,selection.h);ctx.strokeStyle="#111";ctx.lineDashOffset=6;ctx.strokeRect(selection.x,selection.y,selection.w,selection.h);ctx.setLineDash([]);for(const [hx,hy] of [[selection.x,selection.y],[selection.x+selection.w,selection.y],[selection.x,selection.y+selection.h],[selection.x+selection.w,selection.y+selection.h]]){ctx.fillStyle='#fff';ctx.strokeStyle='#111';ctx.lineWidth=1;ctx.fillRect(hx-5,hy-5,10,10);ctx.strokeRect(hx-5,hy-5,10,10)}ctx.restore()}}
function refresh(){scheduleAutosave();render();$('layers').innerHTML='';[...layers].reverse().forEach(l=>{const li=document.createElement('li');li.className=l.id===selected?'active':'';const name=document.createElement('span');name.textContent=(l.locked?'🔒 ':'')+l.name;li.append(name);const toggle=document.createElement('button');toggle.textContent=l.visible?'◉':'○';toggle.title='Toggle visibility';toggle.onclick=e=>{e.stopPropagation();checkpoint();l.visible=!l.visible;refresh()};li.append(toggle);li.onclick=()=>{selected=l.id;refresh()};$('layers').append(li)});const l=active();if(l){$('opacity').value=Math.round(l.opacity*100);$('brightness').value=l.brightness;$('contrast').value=l.contrast;$('opacityval').textContent=Math.round(l.opacity*100)+'%';$('brightnessval').textContent=l.brightness+'%';$('contrastval').textContent=l.contrast+'%'}$('status').textContent=canvas.width+' × '+canvas.height+' · '+layers.length+' layers'+(autosaveWarning?' · '+autosaveWarning:'');updateButtons()}
function addLayer(name){if(layers.length>=MAX_LAYERS){alert('Maximum layer count reached');return null}if((layers.length+1)*canvas.width*canvas.height>48000000){alert('Layer memory budget reached. Reduce canvas size or remove layers.');return null}checkpoint();const l=layer(name||'Layer '+(counter+1));layers.push(l);selected=l.id;refresh();return l}
async function readJpegOrientation(file){if(file.type!=='image/jpeg')return 1;try{const b=await file.slice(0,131072).arrayBuffer(),v=new DataView(b);if(v.getUint16(0)!==0xffd8)return 1;let p=2;while(p+4<v.byteLength){if(v.getUint8(p)!==0xff)break;const marker=v.getUint8(p+1),len=v.getUint16(p+2);if(len<2||p+2+len>v.byteLength)break;if(marker===0xe1&&len>=16&&v.getUint32(p+4)===0x45786966){const t=p+10,le=v.getUint16(t)===0x4949;if(!le&&v.getUint16(t)!==0x4d4d)break;const off=v.getUint32(t+4,le),dir=t+off;if(dir+2>v.byteLength)break;const count=v.getUint16(dir,le);for(let i=0;i<count;i++){const e=dir+2+i*12;if(e+12>v.byteLength)break;if(v.getUint16(e,le)===0x0112)return v.getUint16(e+8,le)}}p+=len+2}}catch(e){console.warn('JPEG orientation metadata unavailable',e)}return 1}
$('open').onclick=()=>$('file').click();$('file').onchange=async e=>{const input=e.target,file=input.files[0];if(!file)return;const reject=message=>{alert(message);input.value=''};if(file.size>25000000){reject('Image exceeds the 25 MB import limit');return}if(!['image/png','image/jpeg','image/webp','image/gif','image/bmp','image/avif'].includes(file.type)){reject('Please choose a supported image');return}if(layers.length>=MAX_LAYERS||(layers.length+1)*canvas.width*canvas.height>48000000){reject('Layer memory budget reached');return}let bitmap=null,url=null;try{let image;if(typeof createImageBitmap==='function'){try{bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});image=bitmap}catch(err){console.warn('ImageBitmap decoding unavailable; using image element',err)}}if(!image){url=URL.createObjectURL(file);const im=new Image();im.decoding='async';await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=()=>reject(Error('Unable to decode image'));im.src=url});image=im}const w=image.width||image.naturalWidth,h=image.height||image.naturalHeight;if(!w||!h||w>6000||h>6000||w*h>MAX_PIXELS)throw Error('Image dimensions are too large');if(layers.length>=MAX_LAYERS||(layers.length+1)*canvas.width*canvas.height>48000000)throw Error('Layer memory budget reached');const scale=Math.min(canvas.width/w,canvas.height/h),dw=w*scale,dh=h*scale;const preview=document.createElement('canvas');preview.width=canvas.width;preview.height=canvas.height;preview.getContext('2d').drawImage(image,(canvas.width-dw)/2,(canvas.height-dh)/2,dw,dh);checkpoint();const l=layer(file.name);l.canvas=preview;layers.push(l);selected=l.id;refresh()}catch(err){alert('Unable to import image: '+err.message)}finally{bitmap?.close();if(url)URL.revokeObjectURL(url);input.value=''}};
$('add').onclick=()=>addLayer();$('delete').onclick=()=>{if(!active()||active().locked)return;checkpoint();layers=layers.filter(l=>l.id!==selected);selected=layers.at(-1)?.id??null;refresh()};
function shift(d){const i=layers.findIndex(l=>l.id===selected),j=i+d;if(i<0||j<0||j>=layers.length||layers[i].locked)return;checkpoint();[layers[i],layers[j]]=[layers[j],layers[i]];refresh()}$('up').onclick=()=>shift(1);$('down').onclick=()=>shift(-1);
let historyBusy=false;async function navigateHistory(direction){if(historyBusy)return;const source=direction==='undo'?history:future,destination=direction==='undo'?future:history;if(!source.length)return;historyBusy=true;const target=source.at(-1),current=capture();try{await restore(target);source.pop();destination.push(current);if(destination.length>12)destination.shift()}catch(err){alert((direction==='undo'?'Undo':'Redo')+' failed: '+err.message)}finally{historyBusy=false;updateButtons()}}$('undo').onclick=()=>navigateHistory('undo');$('redo').onclick=()=>navigateHistory('redo');
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.style.outline='');b.style.outline='2px solid #a19cff'});
$('size').oninput=e=>$('sizeval').textContent=e.target.value;$('zoom').oninput=e=>{canvas.style.width=(canvas.width*Number(e.target.value)/100)+'px';canvas.style.height=(canvas.height*Number(e.target.value)/100)+'px';canvas.style.maxWidth='none';canvas.style.maxHeight='none'};$('fit').onclick=()=>{canvas.style.width='';canvas.style.height='';canvas.style.maxWidth='100%';canvas.style.maxHeight='100%';$('zoom').value=100};
for(const prop of ['opacity','brightness','contrast']){const el=$(prop);el.onpointerdown=()=>{if(active())checkpoint()};el.oninput=()=>{const l=active();if(!l||l.locked)return;l[prop]=prop==='opacity'?Number(el.value)/100:Number(el.value);refresh()}}
$('pan').onclick=()=>{panMode=!panMode;$('pan').textContent=panMode?'Pan: ON':'Pan view';canvas.style.cursor=panMode?'grab':'crosshair'};
let selectionHandle=null;function pos(e){const r=canvas.getBoundingClientRect();return {x:Math.max(0,Math.min(canvas.width,(e.clientX-r.left)*canvas.width/r.width)),y:Math.max(0,Math.min(canvas.height,(e.clientY-r.top)*canvas.height/r.height))}}
canvas.onpointerdown=e=>{if(panMode){drag=true;panStart={x:e.clientX,y:e.clientY,left:canvas.parentElement.scrollLeft,top:canvas.parentElement.scrollTop};canvas.setPointerCapture(e.pointerId);return}const l=active();if(tool!=='select'&&(!l||l.locked))return;if(tool!=='select')checkpoint();drag=true;last=pos(e);canvas.setPointerCapture(e.pointerId);if(tool==='select'){const hit=selection&&[[selection.x,selection.y,'nw'],[selection.x+selection.w,selection.y,'ne'],[selection.x,selection.y+selection.h,'sw'],[selection.x+selection.w,selection.y+selection.h,'se']].find(([x,y])=>Math.abs(x-last.x)<=10&&Math.abs(y-last.y)<=10);selectionHandle=hit?.[2]||null;if(selectionHandle){selectionOrigin={x:selectionHandle.includes('w')?selection.x+selection.w:selection.x,y:selectionHandle.includes('n')?selection.y+selection.h:selection.y}}else{selectionOrigin={...last};selection={x:last.x,y:last.y,w:0,h:0}}render()}else if(tool!=='move')paint(last,last)};
canvas.onpointermove=e=>{if(!drag)return;if(panMode&&panStart){canvas.parentElement.scrollLeft=panStart.left+panStart.x-e.clientX;canvas.parentElement.scrollTop=panStart.top+panStart.y-e.clientY;return}const l=active();if(tool!=='select'&&(!l||l.locked))return;const p=pos(e);if(tool==='select'){const origin=selectionOrigin||last;const x=Math.min(origin.x,p.x),y=Math.min(origin.y,p.y);selection={x,y,w:Math.abs(p.x-origin.x),h:Math.abs(p.y-origin.y)};render()}else if(tool==='move'){l.x+=p.x-last.x;l.y+=p.y-last.y;render()}else paint(last,p);if(tool!=='select')last=p};canvas.onpointerup=()=>{if(drag&&tool==='move'&&$('snapgrid').checked&&!panMode){const l=active();if(l&&!l.locked){const spacing=Math.max(5,Math.min(500,Number($('gridsize').value)||50));l.x=Math.round(l.x/spacing)*spacing;l.y=Math.round(l.y/spacing)*spacing}if(l&&!l.locked&&$('snapcenter').checked){const cx=(canvas.width-l.canvas.width)/2,cy=(canvas.height-l.canvas.height)/2;if(Math.abs(l.x-cx)<=12)l.x=cx;if(Math.abs(l.y-cy)<=12)l.y=cy}}drag=false;panStart=null;selectionOrigin=null;selectionHandle=null;refresh()};canvas.onpointercancel=()=>{drag=false;panStart=null;selectionOrigin=null;selectionHandle=null;refresh()};
function paint(a,b){const l=active();if(!l||l.locked)return;const c=l.canvas.getContext('2d');c.save();c.lineWidth=Number($('size').value);c.lineCap='round';c.lineJoin='round';c.strokeStyle=$('color').value;if(tool==='erase')c.globalCompositeOperation='destination-out';if(selection){c.beginPath();c.rect(selection.x-l.x,selection.y-l.y,selection.w,selection.h);c.clip()}c.beginPath();c.moveTo(a.x-l.x,a.y-l.y);c.lineTo(b.x-l.x,b.y-l.y);if(a.x===b.x&&a.y===b.y){c.lineTo(b.x-l.x+0.01,b.y-l.y+0.01)}c.stroke();c.restore();render()}
$('text').onclick=()=>{const value=prompt('Text to add');if(!value)return;const l=addLayer('Text: '+value.slice(0,20));if(!l)return;const c=l.canvas.getContext('2d');c.fillStyle=$('color').value;c.font='bold 64px sans-serif';c.fillText(value,60,120);refresh()};
$('rectangle').onclick=()=>{const l=addLayer('Rectangle');if(!l)return;const c=l.canvas.getContext('2d');c.fillStyle=$('color').value;c.fillRect(80,80,280,180);refresh()};
$('ellipse').onclick=()=>{const l=addLayer('Ellipse');if(!l)return;const c=l.canvas.getContext('2d');c.fillStyle=$('color').value;c.beginPath();c.ellipse(240,180,160,100,0,0,Math.PI*2);c.fill();refresh()};
$('line').onclick=()=>{const l=addLayer('Line');if(!l)return;const c=l.canvas.getContext('2d');c.strokeStyle=$('color').value;c.lineWidth=Number($('size').value);c.lineCap='round';c.beginPath();c.moveTo(70,90);c.lineTo(470,340);c.stroke();refresh()};
$('background').onclick=()=>{const l=layers[0];if(!l||l.locked)return;checkpoint();const c=l.canvas.getContext('2d');c.save();c.globalCompositeOperation='destination-over';c.fillStyle=$('bgcolor').value;c.fillRect(0,0,canvas.width,canvas.height);c.restore();refresh()};
$('rotate').onclick=()=>{const l=active();if(!l||l.locked)return;checkpoint();const tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=canvas.height;const t=tmp.getContext('2d');t.translate(canvas.width/2,canvas.height/2);t.rotate(Math.PI/2);t.drawImage(l.canvas,-canvas.width/2,-canvas.height/2);l.canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);l.canvas.getContext('2d').drawImage(tmp,0,0);refresh()};
$('flip').onclick=()=>{const l=active();if(!l||l.locked)return;checkpoint();const tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=canvas.height;const t=tmp.getContext('2d');t.translate(tmp.width,0);t.scale(-1,1);t.drawImage(l.canvas,0,0);l.canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);l.canvas.getContext('2d').drawImage(tmp,0,0);refresh()};
$('save').onclick=()=>{render(false);const a=document.createElement('a');a.download='photosoap-design.png';a.href=canvas.toDataURL('image/png');a.click();render()};
function download(data,name){const a=document.createElement('a');a.download=name;a.href=data;a.click()}
$('jpg').onclick=()=>{render(false);const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(canvas,0,0);download(c.toDataURL('image/jpeg',.92),'photosoap-design.jpg');render()};
$('project').onclick=()=>{const data=JSON.stringify({format:'photosoap',version:2,...capture()});const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));download(url,'photosoap-project.json');setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('loadproject').onclick=()=>$('projectfile').click();
$('projectfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.format!=='photosoap'||![1,2].includes(data.version)||!Array.isArray(data.layers)||!Number.isInteger(data.width)||!Number.isInteger(data.height)||data.width<1||data.height<1||data.width>6000||data.height>6000||data.width*data.height>16000000||data.layers.length>50||data.layers.some(l=>typeof l.data!=='string'||!l.data.startsWith('data:image/png;base64,')||l.data.length>50000000))throw Error('Invalid or unsupported project');validateDocument(data);const previous=capture();await restore(data);history.push(previous);future=[];updateButtons()}catch(err){alert('Could not open project: '+err.message)}e.target.value=''};
$('lock').onclick=()=>{const l=active();if(!l)return;checkpoint();l.locked=!l.locked;refresh()};
$('duplicate').onclick=()=>{const l=active();if(!l)return;const n=addLayer(l.name+' copy');if(!n)return;n.canvas.getContext('2d').drawImage(l.canvas,0,0);n.x=l.x;n.y=l.y;n.opacity=l.opacity;n.brightness=l.brightness;n.contrast=l.contrast;refresh()};
$('offsetduplicate').onclick=()=>{const l=active(),offset=Number($('duplicateoffset').value);if(!l||!Number.isInteger(offset)||Math.abs(offset)>1000){alert('Select a layer and enter an offset between -1000 and 1000');return}if(Math.abs(l.x+offset)>12000||Math.abs(l.y+offset)>12000){alert('Duplicate position exceeds the document limit');return}const n=addLayer(l.name+' copy');if(!n)return;n.canvas.getContext('2d').drawImage(l.canvas,0,0);n.x=l.x+offset;n.y=l.y+offset;n.opacity=l.opacity;n.brightness=l.brightness;n.contrast=l.contrast;n.visible=l.visible;n.locked=false;refresh()};
$('clear').onclick=()=>{const l=active();if(!l||l.locked)return;checkpoint();l.canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);refresh()};
function resizeDesign(w,h){if(!Number.isInteger(w)||!Number.isInteger(h)||w<1||h<1||w>6000||h>6000||w*h>MAX_PIXELS||w*h*layers.length>48000000){alert('Design dimensions exceed the canvas or layer memory limit');return false}if(w===canvas.width&&h===canvas.height)return true;checkpoint();const oldW=canvas.width,oldH=canvas.height;layers.forEach(l=>{const old=l.canvas,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(old,0,0,w,h);l.canvas=c;l.x=l.x*w/oldW;l.y=l.y*h/oldH});canvas.width=w;canvas.height=h;selection=null;refresh();return true}
$('resize').onclick=()=>{const w=Number(prompt('New width in pixels (1–6000)',canvas.width)),h=Number(prompt('New height in pixels (1–6000)',canvas.height));if(!Number.isFinite(w)||!Number.isFinite(h))return;resizeDesign(w,h)};
$('applypreset').onclick=()=>{const [w,h]=$('preset').value.split('x').map(Number);resizeDesign(w,h)};
$('showgrid').onchange=()=>render();$('gridsize').onchange=()=>render();
$('applyposition').onclick=()=>{const l=active();if(!l||l.locked){alert('Select an unlocked layer to position');return}const x=Number($('layerx').value),y=Number($('layery').value);if(!Number.isInteger(x)||!Number.isInteger(y)||Math.abs(x)>12000||Math.abs(y)>12000){alert('Position must be an integer between -12000 and 12000');return}const spacing=Math.max(5,Math.min(500,Number($('gridsize').value)||50));const nx=$('snapgrid').checked?Math.round(x/spacing)*spacing:x,ny=$('snapgrid').checked?Math.round(y/spacing)*spacing:y;if(l.x===nx&&l.y===ny)return;checkpoint();l.x=nx;l.y=ny;refresh()};
$('applyalign').onclick=()=>{const l=active();if(!l||l.locked){alert('Select an unlocked layer to align');return}const mode=$('alignlayer').value;const w=l.canvas.width,h=l.canvas.height;let x=l.x,y=l.y;switch(mode){case 'center':x=(canvas.width-w)/2;y=(canvas.height-h)/2;break;case 'left':x=0;break;case 'right':x=canvas.width-w;break;case 'top':y=0;break;case 'bottom':y=canvas.height-h;break;case 'hcenter':x=(canvas.width-w)/2;break;case 'vcenter':y=(canvas.height-h)/2;break;default:return}if(x===l.x&&y===l.y)return;checkpoint();l.x=x;l.y=y;refresh()};
$('deselect').onclick=()=>{selection=null;render()};$('selectall').onclick=()=>{selection={x:0,y:0,w:canvas.width,h:canvas.height};render()};
$('crop').onclick=()=>{if(!selection||selection.w<1||selection.h<1){alert('Choose Select area and drag a rectangle on the canvas first');return}const ox=Math.max(0,Math.floor(selection.x)),oy=Math.max(0,Math.floor(selection.y)),w=Math.min(canvas.width-ox,Math.ceil(selection.x+selection.w)-ox),h=Math.min(canvas.height-oy,Math.ceil(selection.y+selection.h)-oy);if(w<1||h<1||!confirm('Crop canvas to the selected area?'))return;checkpoint();layers.forEach(l=>{const old=l.canvas;const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(old,l.x-ox,l.y-oy);l.canvas=c;l.x=0;l.y=0});canvas.width=w;canvas.height=h;selection=null;refresh()};
window.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement||e.target instanceof HTMLTextAreaElement||e.target.isContentEditable)return;if(e.key==='Escape'){selection=null;render();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)$('redo').click();else $('undo').click()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('project').click()}});
const base=layer('Background');base.canvas.getContext('2d').fillStyle='#ffffff';base.canvas.getContext('2d').fillRect(0,0,canvas.width,canvas.height);layers.push(base);selected=base.id;refresh();clearTimeout(autosaveHandle);recoverAutosave();
</script></body></html>
